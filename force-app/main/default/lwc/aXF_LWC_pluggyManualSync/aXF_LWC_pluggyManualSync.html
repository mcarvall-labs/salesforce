<template>
    <!-- Modo compacto: botão "Sync" simples embutido em uma seção de filtros, sem card/modal -->
    <template if:true={compactMode}>
        <lightning-button
            variant="brand"
            label="Sync"
            icon-name="utility:refresh"
            onclick={handleStartSync}
            disabled={isLoading}
        ></lightning-button>
        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Sincronizando..." size="x-small"></lightning-spinner>
        </template>
    </template>

    <!-- Modo padrão: quick action em tela cheia (card/modal) -->
    <template if:false={compactMode}>
    <div class="manual-sync-modal">
        <!-- Conteúdo Principal -->
        <div class="slds-p-around_large slds-text-align_center sync-card">
            <!-- Ícone e Cabeçalho -->
            <div class="icon-header slds-m-bottom_medium slds-align_absolute-center">
                <lightning-icon icon-name="standard:flow" size="large" alternative-text="Ícone de Sincronização"></lightning-icon>
            </div>
            <h2 class="slds-text-heading_medium slds-m-bottom_x-small sync-title">{title}</h2>
            <p class="slds-text-body_regular slds-m-bottom_large sync-subtitle">
                {description}
            </p>

            <!-- Estado de Carregamento (Loading) -->
            <template if:true={isLoading}>
                <div class="slds-p-around_medium slds-m-bottom_medium loading-box">
                    <lightning-spinner alternative-text="Sincronizando..." size="medium" variant="brand"></lightning-spinner>
                    <p class="slds-m-top_large status-text">Sincronizando dados com a Pluggy...</p>
                    <p class="slds-text-color_weak slds-m-top_x-small">Por favor, não feche esta janela.</p>
                </div>
            </template>

            <!-- Resultado da Sincronização -->
            <template if:true={syncResult}>
                <template if:true={syncResult.isSuccess}>
                    <!-- Banner de Sucesso -->
                    <div class="result-banner result-success slds-p-around_medium slds-m-bottom_large">
                        <lightning-icon icon-name="utility:success" variant="success" size="medium" class="slds-m-right_small slds-shrink-none"></lightning-icon>
                        <div class="result-content">
                            <span class="result-title">Sincronização Concluída</span>
                            <p class="result-desc">{syncResult.message}</p>
                        </div>
                    </div>

                    <!-- Grades de Estatísticas -->
                    <div class="stats-grid slds-grid slds-gutters slds-m-bottom_large">
                        <!-- Transações Bancárias -->
                        <template if:true={showBankStats}>
                            <div class="slds-col">
                                <div class="stat-box">
                                    <span class="stat-num">{syncResult.transactionsSynced}</span>
                                    <span class="stat-lbl">Transações Bancárias</span>
                                </div>
                            </div>
                        </template>

                        <!-- Cartão de Crédito e Faturas -->
                        <template if:true={showCreditStats}>
                            <div class="slds-col">
                                <div class="stat-box">
                                    <span class="stat-num">{syncResult.invoicesSynced}</span>
                                    <span class="stat-lbl">Faturas</span>
                                </div>
                            </div>
                            <div class="slds-col">
                                <div class="stat-box">
                                    <span class="stat-num">{syncResult.transactionsSynced}</span>
                                    <span class="stat-lbl">Transações do Cartão</span>
                                </div>
                            </div>
                        </template>
                    </div>
                </template>

                <template if:false={syncResult.isSuccess}>
                    <!-- Banner de Erro -->
                    <div class="result-banner result-error slds-p-around_medium slds-m-bottom_large">
                        <lightning-icon icon-name="utility:error" variant="error" size="medium" class="slds-m-right_small slds-shrink-none"></lightning-icon>
                        <div class="result-content">
                            <span class="result-title">Erro na Sincronização</span>
                            <p class="result-desc">{syncResult.message}</p>
                        </div>
                    </div>

                    <!-- Detalhes do Erro -->
                    <template if:true={hasDetailedErrors}>
                        <div class="error-details slds-p-around_small slds-m-bottom_medium slds-text-align_left">
                            <p class="error-details-title">Detalhes do Erro</p>
                            <ul>
                                <template for:each={syncResult.errors} for:item="err">
                                    <li key={err} class="error-item">• {err}</li>
                                </template>
                            </ul>
                        </div>
                    </template>
                </template>
            </template>

            <!-- Seleção de Período (Data Início / Data Fim) -->
            <template if:false={isLoading}>
                <template if:false={syncResult}>
                    <div class="period-picker slds-grid slds-gutters slds-m-bottom_medium slds-text-align_left">
                        <div class="slds-col">
                            <lightning-input
                                type="date"
                                label="Data Início"
                                value={startDate}
                                onchange={handleStartDateChange}
                            ></lightning-input>
                        </div>
                        <div class="slds-col">
                            <lightning-input
                                type="date"
                                label="Data Fim"
                                value={endDate}
                                onchange={handleEndDateChange}
                            ></lightning-input>
                        </div>
                    </div>
                </template>
            </template>

            <!-- Rodapé com Botões -->
            <template if:false={isLoading}>
                <div class="button-group slds-m-top_medium">
                    <button class="slds-button slds-button_neutral slds-m-right_small btn-cancel" onclick={closeAction}>
                        {cancelButtonLabel}
                    </button>
                    
                    <template if:false={syncResult}>
                        <button class="slds-button slds-button_brand btn-sync" onclick={handleStartSync}>
                            ⚡ Iniciar Sincronização Agora
                        </button>
                    </template>
                    
                    <template if:true={syncResult}>
                        <button class="slds-button slds-button_brand btn-sync" onclick={handleStartSync}>
                            🔄 Tentar Novamente
                        </button>
                    </template>
                </div>
            </template>
        </div>
    </div>
    </template>
</template>
