<template>
  <lightning-card title={labels.title} icon-name="custom:custom16">
    <div class="slds-var-p-horizontal_medium">
      <p class="slds-var-m-bottom_small">{labels.intro}</p>

      <div aria-live="polite">
        <template lwc:if={message}>
          <div class={messageClass} role="status" tabindex="-1" data-message>
            {message}
          </div>
        </template>
      </div>

      <template lwc:if={loading}>
        <lightning-spinner
          alternative-text={labels.loading}
          size="small"
        ></lightning-spinner>
      </template>

      <template lwc:if={error}>
        <p class="slds-text-color_error" role="alert">{error}</p>
      </template>

      <template lwc:if={noCapability}>
        <p class="slds-text-color_weak" data-no-capability>
          {labels.noCapability}
        </p>
      </template>

      <template lwc:if={showNoAccounts}>
        <p class="slds-text-color_weak" data-no-accounts>{labels.noAccounts}</p>
      </template>

      <template lwc:if={hasAccounts}>
        <table
          class="slds-table slds-table_cell-buffer slds-table_bordered slds-var-m-bottom_medium"
          data-accounts
        >
          <caption class="slds-text-heading_small slds-text-align_left">
            {labels.accountsCaption}
          </caption>
          <thead>
            <tr class="slds-line-height_reset">
              <th scope="col">{labels.colAccount}</th>
              <th scope="col">{labels.colHolder}</th>
              <th scope="col" class="slds-text-align_right">
                {labels.colBalance}
              </th>
              <th scope="col">{labels.colActions}</th>
            </tr>
          </thead>
          <tbody>
            <template for:each={accountRows} for:item="acc">
              <tr key={acc.key} class={acc.rowClass} data-account={acc.key}>
                <th scope="row">{acc.name}</th>
                <td>{acc.holderLabel}</td>
                <td class="slds-text-align_right">
                  <template lwc:if={acc.editing}>
                    <lightning-input
                      type="number"
                      step="0.01"
                      label={labels.newBalance}
                      value={balanceDraft}
                      data-balance={acc.key}
                      onchange={handleBalanceChange}
                      required
                    ></lightning-input>
                  </template>
                  <template lwc:elseif={acc.hasBalance}>
                    <lightning-formatted-number
                      value={acc.currentBalance}
                      format-style="currency"
                      currency-code={acc.currencyIso}
                    ></lightning-formatted-number>
                  </template>
                  <template lwc:else>{labels.balanceUnknown}</template>
                </td>
                <td>
                  <lightning-button-group>
                    <lightning-button
                      label={labels.viewStatement}
                      title={acc.viewLabel}
                      data-id={acc.key}
                      data-action="view"
                      onclick={handleSelect}
                    ></lightning-button>
                    <template lwc:if={acc.canRefresh}>
                      <lightning-button
                        label={labels.refresh}
                        title={acc.refreshLabel}
                        data-id={acc.key}
                        data-action="refresh"
                        disabled={acc.busy}
                        onclick={handleRefresh}
                      ></lightning-button>
                    </template>
                    <template lwc:if={acc.showEdit}>
                      <lightning-button
                        label={labels.editBalance}
                        title={acc.editLabel}
                        data-id={acc.key}
                        data-action="edit-balance"
                        onclick={handleEditBalance}
                      ></lightning-button>
                    </template>
                    <template lwc:if={acc.editing}>
                      <lightning-button
                        variant="brand"
                        label={labels.save}
                        data-id={acc.key}
                        data-action="save-balance"
                        disabled={acc.busy}
                        onclick={handleSaveBalance}
                      ></lightning-button>
                      <lightning-button
                        label={labels.cancel}
                        data-action="cancel-balance"
                        onclick={handleCancelBalance}
                      ></lightning-button>
                    </template>
                  </lightning-button-group>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
      </template>

      <template lwc:if={selectedId}>
        <section aria-labelledby="axf151-statement-heading" data-statement>
          <div class="slds-grid slds-grid_vertical-align-center slds-wrap">
            <lightning-button-icon
              icon-name="utility:chevronleft"
              alternative-text={labels.previousMonth}
              title={labels.previousMonth}
              data-action="previous"
              onclick={handlePrevious}
            ></lightning-button-icon>
            <h2
              id="axf151-statement-heading"
              class="slds-text-heading_small slds-var-m-horizontal_small"
              data-period
            >
              {periodLabel}
            </h2>
            <lightning-button-icon
              icon-name="utility:chevronright"
              alternative-text={labels.nextMonth}
              title={labels.nextMonth}
              data-action="next"
              onclick={handleNext}
            ></lightning-button-icon>
            <div class="slds-col_bump-left">
              <lightning-button
                variant="brand"
                label={labels.newEntry}
                data-action="new-entry"
                onclick={handleNewEntry}
              ></lightning-button>
            </div>
          </div>

          <fieldset class="slds-form-element slds-var-m-vertical_small">
            <legend class="slds-form-element__legend slds-form-element__label">
              {labels.filtersLegend}
            </legend>
            <div class="slds-grid slds-wrap slds-gutters_x-small">
              <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-6">
                <lightning-input
                  type="date"
                  label={labels.fromDate}
                  value={draftFilters.fromDate}
                  data-field="fromDate"
                  data-filter
                  onchange={handleFilterChange}
                ></lightning-input>
              </div>
              <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-6">
                <lightning-input
                  type="date"
                  label={labels.toDate}
                  value={draftFilters.toDate}
                  data-field="toDate"
                  data-filter
                  onchange={handleFilterChange}
                ></lightning-input>
              </div>
              <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-6">
                <lightning-input
                  type="number"
                  step="0.01"
                  min="0"
                  label={labels.minAmount}
                  value={draftFilters.minAmount}
                  data-field="minAmount"
                  data-filter
                  onchange={handleFilterChange}
                ></lightning-input>
              </div>
              <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-6">
                <lightning-input
                  type="number"
                  step="0.01"
                  min="0"
                  label={labels.maxAmount}
                  value={draftFilters.maxAmount}
                  data-field="maxAmount"
                  data-filter
                  onchange={handleFilterChange}
                ></lightning-input>
              </div>
              <div class="slds-col slds-size_1-of-1 slds-medium-size_2-of-6">
                <lightning-input
                  type="search"
                  label={labels.term}
                  value={draftFilters.term}
                  maxlength="100"
                  data-field="term"
                  data-filter
                  onchange={handleFilterChange}
                ></lightning-input>
              </div>
            </div>
            <div class="slds-var-m-top_x-small">
              <lightning-button
                label={labels.applyFilters}
                data-action="apply-filters"
                onclick={handleApplyFilters}
              ></lightning-button>
              <lightning-button
                class="slds-var-m-left_x-small"
                variant="base"
                label={labels.clearFilters}
                data-action="clear-filters"
                onclick={handleClearFilters}
              ></lightning-button>
            </div>
          </fieldset>

          <template lwc:if={statementLoading}>
            <lightning-spinner
              alternative-text={labels.loading}
              size="small"
            ></lightning-spinner>
          </template>

          <template lwc:if={statement}>
            <template lwc:if={statement.truncated}>
              <p class="slds-text-color_weak" role="status">
                {labels.truncated}
              </p>
            </template>
          </template>

          <template lwc:if={showNoLines}>
            <p class="slds-text-color_weak" data-no-lines>{labels.noLines}</p>
          </template>

          <template lwc:if={hasLines}>
            <table
              class="slds-table slds-table_cell-buffer slds-table_bordered"
              data-lines
            >
              <caption class="slds-assistive-text">
                {statementCaption}
              </caption>
              <thead>
                <tr class="slds-line-height_reset">
                  <th scope="col">{labels.colDate}</th>
                  <th scope="col">{labels.colDescription}</th>
                  <th scope="col">{labels.colOrigin}</th>
                  <th scope="col" class="slds-text-align_right">
                    {labels.colAmount}
                  </th>
                  <th scope="col">{labels.colStatus}</th>
                  <th scope="col">{labels.colActions}</th>
                </tr>
              </thead>
              <tbody>
                <template for:each={lineRows} for:item="line">
                  <tr key={line.key} data-line={line.key}>
                    <td>{line.dateText}</td>
                    <th scope="row" class="slds-cell-wrap">
                      {line.description}
                    </th>
                    <td>{line.originLabel}</td>
                    <td class="slds-text-align_right">
                      <lightning-formatted-number
                        value={line.signedAmount}
                        format-style="currency"
                        currency-code={line.currencyIso}
                      ></lightning-formatted-number>
                    </td>
                    <td>
                      <span class={line.statusClass} data-status
                        >{line.statusLabel}</span
                      >
                    </td>
                    <td>
                      <template lwc:if={line.canSuggest}>
                        <lightning-button
                          variant="base"
                          label={labels.showSuggestions}
                          title={line.toggleLabel}
                          aria-expanded={line.ariaExpanded}
                          aria-controls={line.suggestionsId}
                          data-id={line.key}
                          data-action="toggle-suggestions"
                          onclick={handleToggleSuggestions}
                        ></lightning-button>
                      </template>
                    </td>
                  </tr>
                  <template lwc:if={line.expanded}>
                    <tr key={line.subKey} data-suggestions={line.key}>
                      <td colspan="6" id={line.suggestionsId}>
                        <p class="slds-text-title slds-var-m-bottom_x-small">
                          {labels.suggestionsCaption}
                        </p>
                        <template lwc:if={line.suggestionsLoading}>
                          <p role="status">{labels.loading}</p>
                        </template>
                        <template lwc:if={line.noSuggestions}>
                          <p class="slds-text-color_weak" data-no-suggestions>
                            {labels.noSuggestions}
                          </p>
                        </template>
                        <ul class="slds-list_vertical-space">
                          <template
                            for:each={line.suggestionItems}
                            for:item="s"
                          >
                            <li key={s.key}>
                              <lightning-button
                                label={s.text}
                                data-line={line.key}
                                data-index={s.index}
                                data-action="confirm-suggestion"
                                disabled={s.busy}
                                onclick={handleConfirm}
                              ></lightning-button>
                              <template lwc:if={s.tied}>
                                <span class="slds-badge slds-var-m-left_x-small"
                                  >{labels.tied}</span
                                >
                              </template>
                            </li>
                          </template>
                        </ul>
                        <template lwc:if={line.suggestionsTruncated}>
                          <p class="slds-text-color_weak">{labels.truncated}</p>
                        </template>
                      </td>
                    </tr>
                  </template>
                </template>
              </tbody>
            </table>
          </template>
        </section>
      </template>
    </div>
  </lightning-card>
</template>
