<template>
  <lightning-card title="Faturas" icon-name="standard:contract">
    <lightning-button
      slot="actions"
      class="sync-button"
      variant="brand"
      icon-name="utility:sync"
      label={syncLabel}
      disabled={isSyncing}
      onclick={handleSync}
    ></lightning-button>
    <div class="slds-p-horizontal_medium">
      <template if:true={isLoading}>
        <lightning-spinner
          alternative-text="Carregando"
          size="small"
        ></lightning-spinner>
      </template>
      <template if:true={errorMessage}>
        <p class="slds-text-color_error" role="alert">{errorMessage}</p>
      </template>
      <template if:false={isLoading}>
        <template if:false={hasInvoices}>
          <p>Nenhuma fatura.</p>
        </template>
        <template lwc:if={hasInvoices}>
          <div
            class="slds-grid slds-grid_align-center slds-grid_vertical-align-center slds-m-bottom_x-small"
          >
            <lightning-button-icon
              class="invoice-previous"
              icon-name="utility:chevronleft"
              variant="border"
              alternative-text="Fatura anterior"
              disabled={isFirst}
              onclick={handlePrevious}
            ></lightning-button-icon>
            <div class="slds-m-horizontal_medium slds-text-align_center">
              <div class="invoice-period slds-text-heading_small">
                {periodLabel}
              </div>
              <lightning-badge
                class="invoice-status"
                label={selected.statusLabel}
              ></lightning-badge>
            </div>
            <lightning-button-icon
              class="invoice-next"
              icon-name="utility:chevronright"
              variant="border"
              alternative-text="Próxima fatura"
              disabled={isLast}
              onclick={handleNext}
            ></lightning-button-icon>
          </div>
          <div class="slds-text-align_center slds-m-bottom_small">
            <div class="invoice-total slds-text-heading_large">
              <lightning-formatted-number
                value={selected.totalAmount}
                format-style="currency"
                currency-code={selected.currencyCode}
              ></lightning-formatted-number>
            </div>
            <div class="slds-text-color_weak">{lineCount} compras</div>
          </div>
          <template lwc:if={isLoadingLines}>
            <lightning-spinner
              alternative-text="Carregando"
              size="small"
            ></lightning-spinner>
          </template>
          <template lwc:elseif={hasLines}>
            <table class="slds-table slds-table_bordered slds-m-top_x-small">
              <thead>
                <tr>
                  <th scope="col">Data</th>
                  <th scope="col">Descrição</th>
                  <th scope="col">Parcela</th>
                  <th scope="col" class="slds-text-align_right">Valor</th>
                  <th scope="col" class="slds-text-align_right">
                    Valor em BRL
                  </th>
                </tr>
              </thead>
              <tbody>
                <template for:each={lines} for:item="line">
                  <tr key={line.id}>
                    <td>
                      <lightning-formatted-date-time
                        value={line.transactionDate}
                        time-zone="UTC"
                      ></lightning-formatted-date-time>
                    </td>
                    <td>
                      <a href="#" data-id={line.id} onclick={handleOpen}
                        >{line.description}</a
                      >
                    </td>
                    <td>{line.installment}</td>
                    <td class="slds-text-align_right">
                      <lightning-formatted-number
                        value={line.amount}
                        format-style="currency"
                        currency-code={line.originalCurrency}
                      ></lightning-formatted-number>
                    </td>
                    <td class="slds-text-align_right">
                      <lightning-formatted-number
                        value={line.amountBRL}
                        format-style="currency"
                        currency-code="BRL"
                      ></lightning-formatted-number>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </template>
          <template lwc:else>
            <p>Nenhuma transação nesta fatura.</p>
          </template>
        </template>
      </template>
    </div>
  </lightning-card>
</template>
