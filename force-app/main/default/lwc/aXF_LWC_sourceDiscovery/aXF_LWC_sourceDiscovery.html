<template>
  <lightning-card title={labels.TITLE} icon-name="standard:multi_picklist">
    <div class="slds-p-horizontal_medium slds-p-bottom_medium">
      <template lwc:if={multiMode}>
        <p
          class="slds-text-body_small slds-text-color_weak slds-m-bottom_small"
          role="status"
        >
          {labels.MULTI_INTRO}
        </p>

        <lightning-button
          label={labels.REGISTER}
          variant="brand-outline"
          title={labels.REGISTER}
          onclick={openRegister}
        ></lightning-button>

        <template lwc:if={hasConnections}>
          <table
            class="slds-table slds-table_bordered slds-m-top_medium slds-m-bottom_small"
          >
            <thead>
              <tr class="slds-line-height_reset">
                <th scope="col">
                  <span class="slds-assistive-text">{labels.COL_ACTIONS}</span>
                </th>
                <th scope="col">{labels.COL_BANK}</th>
                <th scope="col">{labels.COL_HOLDER}</th>
                <th scope="col">{labels.COL_CONSENT}</th>
                <th scope="col">{labels.COL_STATUS}</th>
                <th scope="col">{labels.COL_FOUND}</th>
              </tr>
            </thead>
            <tbody>
              <template for:each={connections} for:item="c">
                <tr key={c.key}>
                  <td>
                    <lightning-button-icon
                      icon-name="utility:edit_form"
                      variant="bare"
                      alternative-text={labels.EDIT_CONNECTION}
                      title={labels.EDIT_CONNECTION}
                      data-connection={c.connectionId}
                      onclick={openDetails}
                    ></lightning-button-icon>
                    <lightning-button-icon
                      icon-name="utility:delete"
                      variant="bare"
                      alternative-text={labels.DELETE_CONNECTION}
                      title={labels.DELETE_CONNECTION}
                      data-connection={c.connectionId}
                      onclick={requestDelete}
                      class="slds-var-m-left_xx-small"
                    ></lightning-button-icon>
                  </td>
                  <td>
                    <template lwc:if={c.bankPending}>
                      <span class="slds-text-color_weak">{c.bankLabel}</span>
                    </template>
                    <template lwc:else>{c.bankLabel}</template>
                  </td>
                  <td>
                    <template lwc:if={c.holderPending}>
                      <span class="slds-text-color_weak">{c.holderLabel}</span>
                    </template>
                    <template lwc:else>{c.holderLabel}</template>
                  </td>
                  <td>
                    <template lwc:if={c.consentWarn}>
                      <span class="slds-text-color_error"
                        >{c.consentLabel}</span
                      >
                    </template>
                    <template lwc:else>{c.consentLabel}</template>
                  </td>
                  <td>{c.runLabel}</td>
                  <td>{c.found}</td>
                </tr>
              </template>
            </tbody>
          </table>

          <lightning-button
            label={labels.DISCOVER_ALL}
            variant="brand"
            disabled={discoverAllDisabled}
            onclick={handleDiscoverAll}
          ></lightning-button>
          <template lwc:if={running}>
            <p class="slds-m-top_x-small slds-text-color_weak" role="status">
              {labels.DISCOVERING}
            </p>
          </template>
        </template>
        <template lwc:else>
          <p class="slds-m-top_small slds-text-color_weak" role="status">
            {labels.NO_CONNECTIONS_YET}
          </p>
        </template>

        <template lwc:if={feedback}>
          <div class="slds-m-top_small" role="status" aria-live="polite">
            <lightning-formatted-text
              value={feedback}
            ></lightning-formatted-text>
          </div>
        </template>
      </template>

      <template lwc:if={isLoading}>
        <lightning-spinner
          alternative-text="Carregando"
          size="small"
        ></lightning-spinner>
      </template>

      <template lwc:if={isError}>
        <p class="slds-text-color_error" role="alert">{labels.LOAD_ERROR}</p>
        <lightning-button
          label={labels.RETRY}
          onclick={handleRetry}
          class="slds-m-top_x-small"
        ></lightning-button>
      </template>

      <template lwc:if={isReady}>
        <p
          class="slds-text-body_small slds-text-color_weak slds-m-bottom_small"
        >
          {labels.HELP}
        </p>

        <lightning-button
          label={startLabel}
          variant="brand"
          disabled={startDisabled}
          onclick={handleStart}
        ></lightning-button>

        <template lwc:if={running}>
          <p class="slds-m-top_small slds-text-color_weak" role="status">
            {labels.BUSY}
          </p>
        </template>

        <template lwc:if={statusMessage}>
          <div class="slds-m-top_small" role="status" aria-live="polite">
            <lightning-formatted-text
              value={statusMessage}
            ></lightning-formatted-text>
          </div>
        </template>

        <template lwc:if={isRetryable}>
          <p class="slds-m-top_x-small slds-text-color_weak" role="note">
            {labels.INCOMPLETE}
          </p>
        </template>
        <template lwc:if={isTerminal}>
          <p class="slds-m-top_x-small slds-text-color_error" role="alert">
            {labels.INCOMPLETE}
          </p>
        </template>
        <template lwc:if={hasNoSources}>
          <p class="slds-m-top_x-small" role="status">{labels.NONE}</p>
        </template>

        <template lwc:if={showSources}>
          <table class="slds-table slds-table_bordered slds-m-top_small">
            <thead>
              <tr class="slds-line-height_reset">
                <th scope="col">{labels.COL_KIND}</th>
                <th scope="col">{labels.COL_INSTITUTION}</th>
                <th scope="col">{labels.COL_CURRENCY}</th>
                <th scope="col">{labels.COL_STATUS}</th>
              </tr>
            </thead>
            <tbody>
              <template for:each={sources} for:item="s">
                <tr key={s.key}>
                  <td>{s.kindLabel}</td>
                  <td>{s.institution}</td>
                  <td>{s.currencyIsoCode}</td>
                  <td>{s.statusLabel}</td>
                </tr>
              </template>
            </tbody>
          </table>
        </template>

        <template lwc:if={feedback}>
          <div class="slds-m-top_small" role="status" aria-live="polite">
            <lightning-formatted-text
              value={feedback}
            ></lightning-formatted-text>
          </div>
        </template>
      </template>
    </div>
  </lightning-card>

  <template lwc:if={registerOpen}>
    <div class="slds-backdrop slds-backdrop_open"></div>
    <section
      role="dialog"
      tabindex="-1"
      aria-modal="true"
      aria-labelledby="conn-register-title"
      class="slds-modal slds-fade-in-open"
    >
      <div class="slds-modal__container">
        <header class="slds-modal__header">
          <h2 id="conn-register-title" class="slds-modal__title slds-hyphenate">
            {labels.REGISTER_TITLE}
          </h2>
        </header>
        <div class="slds-modal__content slds-p-around_medium">
          <p
            class="slds-text-body_small slds-text-color_weak slds-m-bottom_small"
          >
            {labels.REGISTER_HELP}
          </p>
          <lightning-input
            type="text"
            label={labels.ITEM_ID_LABEL}
            field-level-help={labels.ITEM_ID_HELP}
            value={registerForm.itemId}
            data-field="itemId"
            onchange={handleRegisterInput}
            max-length="64"
            class="slds-m-bottom_small"
          ></lightning-input>
          <div class="slds-m-bottom_small">
            <lightning-record-picker
              label={labels.COL_BANK}
              object-api-name="AXF_OBJ_BankInstitution__c"
              value={registerForm.bankInstitutionId}
              placeholder={labels.PENDING_BANK}
              onchange={handleRegisterBankChange}
            ></lightning-record-picker>
            <lightning-button
              label={labels.NEW_BANK}
              variant="base"
              data-target="REGISTER"
              onclick={openNewBank}
              class="slds-m-top_x-small"
            ></lightning-button>
          </div>
          <div class="slds-m-bottom_small">
            <lightning-record-picker
              label={labels.COL_HOLDER}
              object-api-name="Account"
              value={registerForm.holderId}
              placeholder={labels.PENDING_HOLDER}
              onchange={handleRegisterHolderChange}
            ></lightning-record-picker>
            <lightning-button
              label={labels.NEW_HOLDER}
              variant="base"
              data-target="REGISTER"
              onclick={openNewHolder}
              class="slds-m-top_x-small"
            ></lightning-button>
          </div>
          <template lwc:if={registerFeedback}>
            <p
              class="slds-m-top_small slds-text-color_error"
              role="alert"
              aria-live="assertive"
            >
              {registerFeedback}
            </p>
          </template>
        </div>
        <footer class="slds-modal__footer">
          <lightning-button
            label={labels.CANCEL}
            onclick={closeRegister}
            disabled={registerSaving}
          ></lightning-button>
          <lightning-button
            variant="brand"
            label={registerSaveLabel}
            onclick={saveRegister}
            disabled={registerSaveDisabled}
          ></lightning-button>
        </footer>
      </div>
    </section>
  </template>

  <template lwc:if={detailsOpen}>
    <div class="slds-backdrop slds-backdrop_open"></div>
    <section
      role="dialog"
      tabindex="-1"
      aria-modal="true"
      aria-labelledby="conn-details-title"
      class="slds-modal slds-fade-in-open"
    >
      <div class="slds-modal__container">
        <header class="slds-modal__header">
          <h2 id="conn-details-title" class="slds-modal__title slds-hyphenate">
            {labels.CONNECTION_DETAILS}
          </h2>
        </header>
        <div class="slds-modal__content slds-p-around_medium">
          <template lwc:if={detailsConnection}>
            <dl class="slds-dl_horizontal slds-m-bottom_medium">
              <dt class="slds-dl_horizontal__label">{labels.ITEM_ID}</dt>
              <dd class="slds-dl_horizontal__detail">
                {detailsConnection.itemIdHint}
              </dd>
              <dt class="slds-dl_horizontal__label">{labels.PROVIDER}</dt>
              <dd class="slds-dl_horizontal__detail">
                {detailsConnection.providerInstitution}
              </dd>
              <dt class="slds-dl_horizontal__label">{labels.COL_CONSENT}</dt>
              <dd class="slds-dl_horizontal__detail">
                {detailsConnection.consentLabel}
              </dd>
              <dt class="slds-dl_horizontal__label">{labels.COL_STATUS}</dt>
              <dd class="slds-dl_horizontal__detail">
                {detailsConnection.runLabel}
              </dd>
              <dt class="slds-dl_horizontal__label">{labels.COL_FOUND}</dt>
              <dd class="slds-dl_horizontal__detail">
                {detailsConnection.found}
              </dd>
            </dl>

            <div class="slds-m-bottom_small">
              <lightning-record-picker
                label={labels.COL_BANK}
                object-api-name="AXF_OBJ_BankInstitution__c"
                value={detailsConnection.bankInstitutionId}
                placeholder={labels.PENDING_BANK}
                onchange={handleDetailsBankChange}
                disabled={detailsSaving}
              ></lightning-record-picker>
              <lightning-button
                label={labels.NEW_BANK}
                variant="base"
                data-target={detailsConnectionId}
                onclick={openNewBank}
                disabled={detailsSaving}
                class="slds-m-top_x-small"
              ></lightning-button>
            </div>
            <div class="slds-m-bottom_small">
              <lightning-record-picker
                label={labels.COL_HOLDER}
                object-api-name="Account"
                value={detailsConnection.holderId}
                placeholder={labels.PENDING_HOLDER}
                onchange={handleDetailsHolderChange}
                disabled={detailsSaving}
              ></lightning-record-picker>
              <lightning-button
                label={labels.NEW_HOLDER}
                variant="base"
                data-target={detailsConnectionId}
                onclick={openNewHolder}
                disabled={detailsSaving}
                class="slds-m-top_x-small"
              ></lightning-button>
            </div>
          </template>
          <template lwc:if={detailsFeedback}>
            <template lwc:if={detailsFeedbackIsError}>
              <p
                class="slds-m-top_small slds-text-color_error"
                role="alert"
                aria-live="assertive"
              >
                {detailsFeedback}
              </p>
            </template>
            <template lwc:else>
              <p
                class="slds-m-top_small slds-text-color_success"
                role="status"
                aria-live="polite"
              >
                {detailsFeedback}
              </p>
            </template>
          </template>
        </div>
        <footer class="slds-modal__footer">
          <lightning-button
            label={labels.CLOSE}
            onclick={closeDetails}
            disabled={detailsSaving}
          ></lightning-button>
        </footer>
      </div>
    </section>
  </template>

  <template lwc:if={deleteOpen}>
    <div class="slds-backdrop slds-backdrop_open"></div>
    <section
      role="dialog"
      tabindex="-1"
      aria-modal="true"
      aria-labelledby="conn-delete-title"
      class="slds-modal slds-fade-in-open"
    >
      <div class="slds-modal__container">
        <header class="slds-modal__header">
          <h2 id="conn-delete-title" class="slds-modal__title slds-hyphenate">
            {labels.DELETE_TITLE}
          </h2>
        </header>
        <div class="slds-modal__content slds-p-around_medium">
          <p class="slds-m-bottom_small">{deleteQuestion}</p>
          <p class="slds-text-body_small slds-text-color_weak">
            {labels.DELETE_WARNING}
          </p>
          <template lwc:if={deleteFeedback}>
            <p
              class="slds-m-top_small slds-text-color_error"
              role="alert"
              aria-live="assertive"
            >
              {deleteFeedback}
            </p>
          </template>
        </div>
        <footer class="slds-modal__footer">
          <lightning-button
            label={labels.CANCEL}
            onclick={closeDeleteConfirm}
            disabled={deleteSaving}
          ></lightning-button>
          <lightning-button
            variant="destructive"
            label={labels.DELETE_CONNECTION}
            onclick={confirmDelete}
            disabled={deleteSaving}
          ></lightning-button>
        </footer>
      </div>
    </section>
  </template>

  <template lwc:if={newBankOpen}>
    <div class="slds-backdrop slds-backdrop_open"></div>
    <section
      role="dialog"
      tabindex="-1"
      aria-modal="true"
      aria-labelledby="new-bank-title"
      class="slds-modal slds-fade-in-open"
    >
      <div class="slds-modal__container">
        <header class="slds-modal__header">
          <h2 id="new-bank-title" class="slds-modal__title slds-hyphenate">
            {labels.NEW_BANK_TITLE}
          </h2>
        </header>
        <div class="slds-modal__content slds-p-around_medium">
          <lightning-input
            label={labels.BANK_NAME}
            value={newBank.name}
            data-field="name"
            onchange={handleNewBankInput}
            maxlength="80"
            class="slds-m-bottom_small"
          ></lightning-input>
          <lightning-input
            label={labels.BANK_NUMBER}
            value={newBank.bankNumber}
            data-field="bankNumber"
            onchange={handleNewBankInput}
            maxlength="8"
            class="slds-m-bottom_small"
          ></lightning-input>
          <template lwc:if={newBankFeedback}>
            <p
              class="slds-m-top_small slds-text-color_error"
              role="alert"
              aria-live="assertive"
            >
              {newBankFeedback}
            </p>
          </template>
        </div>
        <footer class="slds-modal__footer">
          <lightning-button
            label={labels.CANCEL}
            onclick={closeNewBank}
            disabled={newBankSaving}
          ></lightning-button>
          <lightning-button
            variant="brand"
            label={newBankSaveLabel}
            onclick={saveNewBank}
            disabled={newBankSaving}
          ></lightning-button>
        </footer>
      </div>
    </section>
  </template>

  <template lwc:if={newHolderOpen}>
    <div class="slds-backdrop slds-backdrop_open"></div>
    <section
      role="dialog"
      tabindex="-1"
      aria-modal="true"
      aria-labelledby="new-holder-title"
      class="slds-modal slds-fade-in-open"
    >
      <div class="slds-modal__container">
        <header class="slds-modal__header">
          <h2 id="new-holder-title" class="slds-modal__title slds-hyphenate">
            {labels.NEW_HOLDER_TITLE}
          </h2>
        </header>
        <div class="slds-modal__content slds-p-around_medium">
          <lightning-radio-group
            name="holderType"
            label={labels.HOLDER_TYPE}
            options={holderTypeOptions}
            value={newHolder.type}
            type="radio"
            onchange={handleHolderTypeChange}
            class="slds-m-bottom_small"
          ></lightning-radio-group>
          <template lwc:if={newHolderIsPerson}>
            <lightning-input
              label={labels.FIRST_NAME}
              value={newHolder.firstName}
              data-field="firstName"
              onchange={handleHolderInput}
              maxlength="80"
              class="slds-m-bottom_small"
            ></lightning-input>
            <lightning-input
              label={labels.LAST_NAME}
              value={newHolder.lastName}
              data-field="lastName"
              onchange={handleHolderInput}
              maxlength="80"
              class="slds-m-bottom_small"
            ></lightning-input>
          </template>
          <template lwc:else>
            <lightning-input
              label={labels.BUSINESS_NAME}
              value={newHolder.name}
              data-field="name"
              onchange={handleHolderInput}
              maxlength="255"
              class="slds-m-bottom_small"
            ></lightning-input>
          </template>
          <template lwc:if={newHolderFeedback}>
            <p
              class="slds-m-top_small slds-text-color_error"
              role="alert"
              aria-live="assertive"
            >
              {newHolderFeedback}
            </p>
          </template>
        </div>
        <footer class="slds-modal__footer">
          <lightning-button
            label={labels.CANCEL}
            onclick={closeNewHolder}
            disabled={newHolderSaving}
          ></lightning-button>
          <template lwc:if={newHolderShowConfirm}>
            <lightning-button
              variant="brand"
              label={labels.CONFIRM_DUPLICATE}
              onclick={handleSaveNewHolderConfirm}
              disabled={newHolderSaving}
            ></lightning-button>
          </template>
          <template lwc:else>
            <lightning-button
              variant="brand"
              label={newHolderSaveLabel}
              onclick={handleSaveNewHolder}
              disabled={newHolderSaving}
            ></lightning-button>
          </template>
        </footer>
      </div>
    </section>
  </template>
</template>
