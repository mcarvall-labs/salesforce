<template>
  <lightning-card title={labels.TITLE} icon-name="standard:multi_picklist">
    <div class="slds-p-horizontal_medium slds-p-bottom_medium">
      <template lwc:if={multiMode}>
        <p
          class="slds-text-body_small slds-text-color_weak slds-m-bottom_small"
          role="status"
        >
          {labels.MULTI_INTRO}
        </p>

        <lightning-input
          type="text"
          label={labels.ITEM_ID_LABEL}
          field-level-help={labels.ITEM_ID_HELP}
          value={itemId}
          onchange={handleItemIdChange}
          max-length="64"
          class="slds-m-bottom_x-small"
        ></lightning-input>
        <lightning-button
          label={labels.REGISTER}
          variant="brand-outline"
          disabled={registerDisabled}
          onclick={handleRegister}
        ></lightning-button>
        <template lwc:if={registering}>
          <p class="slds-m-top_x-small slds-text-color_weak" role="status">
            {labels.REGISTERING}
          </p>
        </template>

        <template lwc:if={hasConnections}>
          <table
            class="slds-table slds-table_bordered slds-m-top_medium slds-m-bottom_small"
          >
            <thead>
              <tr class="slds-line-height_reset">
                <th scope="col">{labels.COL_CONN}</th>
                <th scope="col">{labels.COL_CONSENT}</th>
                <th scope="col">{labels.COL_STATUS}</th>
                <th scope="col">{labels.COL_FOUND}</th>
              </tr>
            </thead>
            <tbody>
              <template for:each={connections} for:item="c">
                <tr key={c.key}>
                  <td>
                    {c.name}
                    <span class="slds-text-color_weak">({c.itemIdHint})</span>
                  </td>
                  <td>
                    <template lwc:if={c.consentWarn}>
                      <span class="slds-text-color_error"
                        >{c.consentLabel}</span
                      >
                    </template>
                    <template lwc:else>{c.consentLabel}</template>
                  </td>
                  <td>{c.runLabel}</td>
                  <td>{c.found}</td>
                </tr>
              </template>
            </tbody>
          </table>

          <lightning-button
            label={labels.DISCOVER_ALL}
            variant="brand"
            disabled={discoverAllDisabled}
            onclick={handleDiscoverAll}
          ></lightning-button>
          <template lwc:if={running}>
            <p class="slds-m-top_x-small slds-text-color_weak" role="status">
              {labels.DISCOVERING}
            </p>
          </template>
        </template>
        <template lwc:else>
          <p class="slds-m-top_small slds-text-color_weak" role="status">
            {labels.NO_CONNECTIONS_YET}
          </p>
        </template>

        <template lwc:if={feedback}>
          <div class="slds-m-top_small" role="status" aria-live="polite">
            <lightning-formatted-text
              value={feedback}
            ></lightning-formatted-text>
          </div>
        </template>
      </template>

      <template lwc:if={isLoading}>
        <lightning-spinner
          alternative-text="Carregando"
          size="small"
        ></lightning-spinner>
      </template>

      <template lwc:if={isError}>
        <p class="slds-text-color_error" role="alert">{labels.LOAD_ERROR}</p>
        <lightning-button
          label={labels.RETRY}
          onclick={handleRetry}
          class="slds-m-top_x-small"
        ></lightning-button>
      </template>

      <template lwc:if={isReady}>
        <p
          class="slds-text-body_small slds-text-color_weak slds-m-bottom_small"
        >
          {labels.HELP}
        </p>

        <lightning-button
          label={startLabel}
          variant="brand"
          disabled={startDisabled}
          onclick={handleStart}
        ></lightning-button>

        <template lwc:if={running}>
          <p class="slds-m-top_small slds-text-color_weak" role="status">
            {labels.BUSY}
          </p>
        </template>

        <template lwc:if={statusMessage}>
          <div class="slds-m-top_small" role="status" aria-live="polite">
            <lightning-formatted-text
              value={statusMessage}
            ></lightning-formatted-text>
          </div>
        </template>

        <template lwc:if={isRetryable}>
          <p class="slds-m-top_x-small slds-text-color_weak" role="note">
            {labels.INCOMPLETE}
          </p>
        </template>
        <template lwc:if={isTerminal}>
          <p class="slds-m-top_x-small slds-text-color_error" role="alert">
            {labels.INCOMPLETE}
          </p>
        </template>
        <template lwc:if={hasNoSources}>
          <p class="slds-m-top_x-small" role="status">{labels.NONE}</p>
        </template>

        <template lwc:if={showSources}>
          <table class="slds-table slds-table_bordered slds-m-top_small">
            <thead>
              <tr class="slds-line-height_reset">
                <th scope="col">{labels.COL_KIND}</th>
                <th scope="col">{labels.COL_INSTITUTION}</th>
                <th scope="col">{labels.COL_CURRENCY}</th>
                <th scope="col">{labels.COL_STATUS}</th>
              </tr>
            </thead>
            <tbody>
              <template for:each={sources} for:item="s">
                <tr key={s.key}>
                  <td>{s.kindLabel}</td>
                  <td>{s.institution}</td>
                  <td>{s.currencyIsoCode}</td>
                  <td>{s.statusLabel}</td>
                </tr>
              </template>
            </tbody>
          </table>
        </template>

        <template lwc:if={feedback}>
          <div class="slds-m-top_small" role="status" aria-live="polite">
            <lightning-formatted-text
              value={feedback}
            ></lightning-formatted-text>
          </div>
        </template>
      </template>
    </div>
  </lightning-card>
</template>
