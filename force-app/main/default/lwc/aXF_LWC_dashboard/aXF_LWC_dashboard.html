<template>
  <lightning-card title="Início" icon-name="standard:dashboard">
    <div class="slds-p-horizontal_medium">
      <div class="filters slds-grid slds-grid_vertical-align-end slds-wrap">
        <lightning-combobox
          class="holder-filter slds-m-right_small"
          label="Titular"
          value={holderId}
          options={holderOptions}
          onchange={handleHolderChange}
        ></lightning-combobox>
        <div class="month-filter slds-grid slds-grid_vertical-align-end">
          <lightning-button-icon
            class="previous-month"
            icon-name="utility:chevronleft"
            alternative-text="Mês anterior"
            onclick={handlePreviousMonth}
          ></lightning-button-icon>
          <lightning-combobox
            class="month-select slds-m-horizontal_xx-small"
            label="Mês"
            value={month}
            options={monthOptions}
            onchange={handleMonthChange}
          ></lightning-combobox>
          <lightning-button-icon
            class="next-month"
            icon-name="utility:chevronright"
            alternative-text="Próximo mês"
            onclick={handleNextMonth}
          ></lightning-button-icon>
        </div>
      </div>

      <div class="slds-is-relative slds-m-top_small">
        <template lwc:if={isLoading}>
          <lightning-spinner
            alternative-text="Carregando"
            size="small"
          ></lightning-spinner>
        </template>
      </div>
      <template lwc:if={holdersError}>
        <p
          class="holders-error slds-text-color_error slds-m-top_small"
          role="alert"
        >
          {holdersError}
        </p>
      </template>
      <template lwc:if={errorMessage}>
        <p class="error slds-text-color_error slds-m-top_small" role="alert">
          {errorMessage}
        </p>
      </template>

      <template lwc:if={hasSummary}>
        <div class="kpis slds-grid slds-wrap slds-m-top_medium">
          <div class="kpi kpi-overdue slds-box slds-m-right_small">
            <p class="slds-text-title">Vencidos</p>
            <p class={overdueClass}>{overdueTotal}</p>
            <p class="slds-text-color_weak">{overdueCaption}</p>
          </div>
          <div class="kpi kpi-due-soon slds-box slds-m-right_small">
            <p class="slds-text-title">A vencer no mês</p>
            <p class={dueSoonClass}>{dueSoonTotal}</p>
            <p class="slds-text-color_weak">{dueSoonCaption}</p>
          </div>
          <div class="kpi kpi-flow slds-box slds-m-right_small">
            <p class="slds-text-title">Receitas · Despesas</p>
            <p class="kpi-value in">{incomeTotal}</p>
            <p class="slds-text-color_weak">
              despesas <span class="out">{expenseTotal}</span>
            </p>
            <p class="planned slds-text-color_weak">{plannedCaption}</p>
          </div>
          <div class="kpi kpi-projected slds-box">
            <p class="slds-text-title">Saldo final previsto</p>
            <p class={projectedClass}>{projectedTotal}</p>
            <lightning-input
              class="card-toggle"
              type="toggle"
              label={cardLabel}
              checked={includeCard}
              onchange={handleCardToggle}
            ></lightning-input>
          </div>
        </div>
      </template>
      <template lwc:if={budgetError}>
        <p
          class="budget-error slds-text-color_error slds-m-top_small"
          role="alert"
        >
          {budgetError}
        </p>
      </template>
      <template lwc:if={hasBudget}>
        <div class="budget slds-box slds-m-top_medium">
          <div class="slds-grid slds-grid_align-spread">
            <p class="slds-text-title">Metas de despesa</p>
            <lightning-button
              class="budget-toggle"
              variant="base"
              label={budgetToggleLabel}
              onclick={handleBudgetToggle}
            ></lightning-button>
          </div>
          <template for:each={visibleBudgetRows} for:item="row">
            <div key={row.key} class="budget-row slds-m-top_small">
              <div class="slds-grid slds-grid_align-spread">
                <span class="budget-name">{row.name}</span>
                <span class="budget-values slds-text-color_weak"
                  >{row.realizedText} realizado · {row.plannedText} previsto ·
                  {row.goalText}</span
                >
              </div>
              <template lwc:if={row.hasGoal}>
                <div class={row.barClass}>
                  <div class="planned-fill" style={row.plannedStyle}></div>
                  <div class="realized-fill" style={row.realizedStyle}></div>
                </div>
              </template>
              <template lwc:if={row.alert}>
                <p class="budget-alert slds-text-color_error">{row.alert}</p>
              </template>
            </div>
          </template>
          <template lwc:if={showCardForecast}>
            <div
              class="card-forecast-line slds-grid slds-grid_align-spread slds-m-top_small"
            >
              <span>Cartão previsto</span>
              <span>{cardForecastLine}</span>
            </div>
          </template>
        </div>
      </template>
    </div>
  </lightning-card>
</template>
