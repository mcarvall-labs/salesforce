<template>
  <section
    role="dialog"
    aria-modal="true"
    aria-labelledby="wizard-title"
    class="slds-modal slds-fade-in-open"
  >
    <div class="slds-modal__container">
      <header class="slds-modal__header">
        <h2
          id="wizard-title"
          class="wizard-title slds-modal__title slds-hyphenate"
          tabindex="-1"
        >
          {title}
        </h2>
        <template lwc:if={isChoosingType}></template>
        <template lwc:else>
          <p class="wizard-step slds-m-top_x-small">{stepLabel}</p>
          <lightning-progress-bar
            value={progress}
            size="small"
            aria-label="Progresso do assistente"
          ></lightning-progress-bar>
        </template>
      </header>
      <div class="slds-modal__content slds-p-around_medium">
        <template lwc:if={errorMessage}>
          <div
            class="wizard-error slds-text-color_error slds-m-bottom_small"
            role="alert"
          >
            {errorMessage}
          </div>
        </template>

        <template lwc:if={isChoosingType}>
          <div class="slds-grid slds-wrap slds-gutters_small">
            <template for:each={typeButtons} for:item="type">
              <div
                key={type.value}
                class="slds-col slds-size_1-of-2 slds-m-bottom_small"
              >
                <lightning-button
                  class="type-button"
                  data-type={type.value}
                  label={type.label}
                  title={type.title}
                  variant={type.variant}
                  disabled={type.disabled}
                  onclick={handleTypeClick}
                ></lightning-button>
              </div>
            </template>
          </div>
        </template>

        <template lwc:elseif={isStep1}>
          <template lwc:if={hasHolderContext}></template>
          <template lwc:else>
            <lightning-combobox
              class="field-holder"
              label="Titular"
              options={holderOptions}
              value={chosenHolderId}
              required
              onchange={handleHolder}
            ></lightning-combobox>
          </template>
          <lightning-input
            class="field-description"
            label="Descrição"
            value={description}
            required
            onchange={handleDescription}
          ></lightning-input>
          <lightning-input
            class="field-amount"
            type="number"
            step="0.01"
            min="0.01"
            label="Valor"
            value={amount}
            required
            onchange={handleAmount}
          ></lightning-input>
          <lightning-input
            class="field-due"
            type="date"
            label="Vencimento"
            value={dueDate}
            required
            onchange={handleDueDate}
          ></lightning-input>
          <lightning-combobox
            class="field-category"
            label="Categoria"
            options={categoryOptions}
            value={categoryId}
            onchange={handleCategory}
          ></lightning-combobox>
          <lightning-radio-group
            class="field-status"
            name="status"
            label="Situação"
            options={statusOptions}
            value={status}
            type="radio"
            onchange={handleStatus}
          ></lightning-radio-group>
          <template lwc:if={isRealized}>
            <lightning-input
              class="field-payment-date"
              type="date"
              label="Data de pagamento"
              value={paymentDate}
              required
              onchange={handlePaymentDate}
            ></lightning-input>
          </template>
        </template>

        <template lwc:elseif={isStep2}>
          <lightning-combobox
            class="field-method"
            label="Como foi/será pago?"
            options={methodOptions}
            value={method}
            onchange={handleMethod}
          ></lightning-combobox>
          <template lwc:if={needsSource}>
            <lightning-combobox
              class="field-source"
              label={sourceLabel}
              options={sourceOptions}
              value={sourceId}
              required
              onchange={handleSource}
            ></lightning-combobox>
          </template>
        </template>

        <template lwc:else>
          <p class="review-line slds-text-heading_small">{reviewLine}</p>
          <p class="review-summary slds-m-top_small">{reviewSummary}</p>
        </template>
      </div>
      <footer class="slds-modal__footer">
        <lightning-button
          class="cancel slds-m-right_x-small"
          label="Cancelar"
          onclick={handleCancel}
        ></lightning-button>
        <template lwc:if={isChoosingType}></template>
        <template lwc:else>
          <template lwc:if={isStep1}>
            <lightning-button
              class="change-type slds-m-right_x-small"
              label="Trocar tipo"
              onclick={handleChangeType}
            ></lightning-button>
          </template>
          <template lwc:else>
            <lightning-button
              class="back slds-m-right_x-small"
              label="Voltar"
              disabled={isSaving}
              onclick={handleBack}
            ></lightning-button>
          </template>
          <template lwc:if={isLast}>
            <lightning-button
              class="conclude"
              variant="brand"
              label="Concluir"
              disabled={isSaving}
              onclick={handleConclude}
            ></lightning-button>
          </template>
          <template lwc:else>
            <lightning-button
              class="next"
              variant="brand"
              label="Próximo"
              disabled={nextDisabled}
              onclick={handleNext}
            ></lightning-button>
          </template>
        </template>
      </footer>
    </div>
  </section>
  <div class="slds-backdrop slds-backdrop_open"></div>
</template>
