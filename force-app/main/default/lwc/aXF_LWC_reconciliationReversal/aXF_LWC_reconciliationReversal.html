<template>
  <lightning-card title={labels.title} icon-name="standard:record_delete">
    <div class="slds-p-horizontal_medium slds-p-bottom_medium">
      <p class="slds-text-body_small slds-m-bottom_small">{labels.intro}</p>
      <template lwc:if={cannotReverse}>
        <div class="slds-box slds-theme_shade" role="status">
          {labels.noCapability}
        </div>
      </template>
      <template lwc:if={error}>
        <div
          class="slds-notify slds-notify_alert slds-theme_alert-texture slds-theme_error slds-m-bottom_small"
          role="alert"
        >
          <span>{error}</span>
        </div>
      </template>
      <template lwc:if={canReverse}>
        <template lwc:if={isList}>
          <div class="slds-grid slds-gutters slds-wrap">
            <div class="slds-col slds-size_1-of-1 slds-medium-size_5-of-12">
              <lightning-combobox
                label={labels.holder}
                placeholder={labels.holderPlaceholder}
                options={holderOptions}
                value={holderId}
                onchange={handleHolder}
                data-id="holder"
              ></lightning-combobox>
            </div>
            <div class="slds-col slds-align-bottom">
              <lightning-button
                variant="brand"
                label={labels.load}
                onclick={handleLoad}
                disabled={loadDisabled}
                data-id="load"
              ></lightning-button>
            </div>
          </div>
          <template lwc:if={busy}
            ><p class="slds-m-top_small" role="status">
              {labels.loading}
            </p></template
          >
          <template lwc:if={showEmpty}>
            <div
              class="slds-box slds-theme_shade slds-m-top_small"
              role="status"
              data-id="empty"
            >
              {labels.empty}
            </div>
          </template>
          <template lwc:if={hasRows}>
            <table
              class="slds-table slds-table_cell-buffer slds-table_bordered slds-m-top_small"
              data-id="table"
            >
              <thead>
                <tr class="slds-line-height_reset">
                  <th scope="col">{labels.colDate}</th>
                  <th scope="col">{labels.colTarget}</th>
                  <th scope="col">{labels.colRole}</th>
                  <th scope="col">{labels.colSource}</th>
                  <th scope="col">{labels.colAmount}</th>
                  <th scope="col">{labels.colStatus}</th>
                  <th scope="col">{labels.colAction}</th>
                </tr>
              </thead>
              <tbody>
                <template for:each={rows} for:item="row">
                  <tr key={row.key} class="slds-hint-parent">
                    <td>
                      <lightning-formatted-date-time
                        value={row.recognitionDate}
                      ></lightning-formatted-date-time>
                    </td>
                    <td>
                      {row.targetDescription}
                      <template lwc:if={row.scheduleLinked}>
                        <lightning-badge
                          label={labels.scheduleLinked}
                          class="slds-m-left_x-small"
                        ></lightning-badge>
                      </template>
                    </td>
                    <td>{row.planKind}</td>
                    <td>{row.sourceLabel}</td>
                    <td>
                      <lightning-formatted-number
                        value={row.amount}
                        format-style="currency"
                        currency-code={row.currencyIso}
                      ></lightning-formatted-number>
                    </td>
                    <td>{row.statusLabel}</td>
                    <td>
                      <template lwc:if={row.reversed}></template>
                      <template lwc:else>
                        <lightning-button
                          label={labels.select}
                          data-index={row.index}
                          onclick={handleSelect}
                          disabled={busy}
                        ></lightning-button>
                      </template>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
            <template lwc:if={hasMore}>
              <lightning-button
                class="slds-m-top_small"
                label={labels.loadMore}
                onclick={handleMore}
                disabled={busy}
                data-id="more"
              ></lightning-button>
            </template>
          </template>
        </template>

        <template lwc:if={isReview}>
          <p class="slds-text-body_small slds-m-bottom_small">
            {labels.reviewIntro}
          </p>
          <dl class="slds-dl_horizontal slds-m-bottom_small">
            <dt class="slds-dl_horizontal__label">{labels.selected}</dt>
            <dd class="slds-dl_horizontal__detail" data-id="selectedSummary">
              {selectedSummary}
            </dd>
          </dl>
          <div class="slds-grid slds-gutters slds-wrap">
            <div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12">
              <lightning-combobox
                label={labels.reason}
                placeholder={labels.reasonPlaceholder}
                options={reasonOptions}
                value={reasonCode}
                onchange={handleReason}
                data-id="reason"
                required
              ></lightning-combobox>
            </div>
            <div class="slds-col slds-size_1-of-1 slds-medium-size_8-of-12">
              <lightning-input
                label={labels.note}
                value={reasonNote}
                max-length="255"
                onchange={handleNote}
                data-id="note"
              ></lightning-input>
            </div>
          </div>
          <div class="slds-m-top_medium">
            <lightning-button
              label={labels.back}
              onclick={handleBack}
              disabled={busy}
              data-id="back"
            ></lightning-button>
            <lightning-button
              class="slds-m-left_small"
              variant="destructive"
              label={confirmLabel}
              onclick={handleConfirm}
              disabled={confirmDisabled}
              data-id="confirm"
            ></lightning-button>
          </div>
        </template>

        <template lwc:if={isDone}>
          <div class="slds-box slds-theme_success" role="status" data-id="done">
            <p class="slds-text-heading_small">{labels.done}</p>
            <template lwc:if={resultReplayed}
              ><p>{labels.doneReplayed}</p></template
            >
            <template lwc:if={resultActualOnly}
              ><p data-id="actualOnly">{labels.doneActualOnly}</p></template
            >
            <p>{labels.doneCompensation}: {result.reversalId}</p>
            <p>{labels.doneOriginal}: {result.originalId}</p>
            <p data-id="net">{resultNet}</p>
            <template for:each={resultBoundaries} for:item="b">
              <p key={b.key} class="slds-text-color_weak" data-id="boundary">
                {b.label}
              </p>
            </template>
          </div>
          <lightning-button
            class="slds-m-top_small"
            label={labels.newReversal}
            onclick={handleNew}
            data-id="new"
          ></lightning-button>
        </template>
        <p class="slds-text-body_small slds-text-color_weak slds-m-top_medium">
          {labels.policy}: {policyVersion}
        </p>
      </template>
    </div>
  </lightning-card>
</template>
