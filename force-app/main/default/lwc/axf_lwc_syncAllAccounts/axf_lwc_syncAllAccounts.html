<template>
    <div class="sync-container slds-card slds-p-around_large slds-align_absolute-center">
        <div class="sync-card slds-text-align_center">
            <div class="icon-header slds-m-bottom_medium">
                <lightning-icon icon-name="standard:flow" size="large" alternative-text={labels.title}></lightning-icon>
            </div>
            <h2 class="slds-text-heading_medium slds-m-bottom_x-small sync-title">{labels.title}</h2>
            <p class="slds-text-body_regular slds-m-bottom_large sync-subtitle">
                {labels.desc}
            </p>

            <template if:true={isLoading}>
                <div class="slds-p-around_medium slds-m-bottom_medium loading-box">
                    <lightning-spinner alternative-text={labels.syncingAccounts} size="medium" variant="brand"></lightning-spinner>
                    <p class="slds-m-top_large status-text">{statusMessage}</p>
                </div>
            </template>

            <template if:true={syncResult}>
                <template if:true={syncResult.isSuccess}>
                    <div class="result-banner result-success slds-p-around_medium slds-m-bottom_large">
                        <lightning-icon icon-name="utility:success" variant="success" size="medium" class="slds-m-right_small slds-shrink-none"></lightning-icon>
                        <div class="result-content">
                            <span class="result-title">{labels.syncCompleted}</span>
                            <p class="result-desc">{syncResult.message}</p>
                        </div>
                    </div>

                    <div class="stats-grid slds-grid slds-gutters slds-m-bottom_large">
                        <div class="slds-col">
                            <div class="stat-box">
                                <span class="stat-num">{syncResult.bankAccountsSynced}</span>
                                <span class="stat-lbl">{labels.bankAccounts}</span>
                            </div>
                        </div>
                        <div class="slds-col">
                            <div class="stat-box">
                                <span class="stat-num">{syncResult.creditCardsSynced}</span>
                                <span class="stat-lbl">{labels.creditCards}</span>
                            </div>
                        </div>
                    </div>
                </template>

                <template if:false={syncResult.isSuccess}>
                    <div class="result-banner result-error slds-p-around_medium slds-m-bottom_large">
                        <lightning-icon icon-name="utility:error" variant="error" size="medium" class="slds-m-right_small slds-shrink-none"></lightning-icon>
                        <div class="result-content">
                            <span class="result-title">{labels.syncError}</span>
                            <p class="result-desc">{syncResult.message}</p>
                        </div>
                    </div>

                    <template if:true={hasDetailedErrors}>
                        <div class="error-details slds-p-around_small slds-m-bottom_medium slds-text-align_left">
                            <p class="error-details-title">{labels.errorDetails}</p>
                            <ul>
                                <template for:each={syncResult.errors} for:item="err">
                                    <li key={err} class="error-item">• {err}</li>
                                </template>
                            </ul>
                        </div>
                    </template>
                </template>
            </template>

            <template if:false={isLoading}>
                <div class="button-group slds-m-top_medium">
                    <button class="slds-button slds-button_neutral slds-m-right_small btn-cancel" onclick={handleCancel}>
                        {cancelButtonLabel}
                    </button>
                    <template if:false={syncResult}>
                        <button class="slds-button slds-button_brand btn-sync" onclick={handleStartSync}>
                            ⚡ {labels.startSyncNow}
                        </button>
                    </template>
                    <template if:true={syncResult}>
                        <button class="slds-button slds-button_brand btn-sync" onclick={handleStartSync}>
                            🔄 {labels.tryAgain}
                        </button>
                    </template>
                </div>
            </template>
        </div>
    </div>
</template>
