<template>
  <div class="slds-form-element">
    <template if:true={label}>
      <label class="slds-form-element__label">{label}</label>
    </template>
    <div class="slds-form-element__control">
      <div class="slds-combobox_container">
        <div
          class={comboboxClass}
          aria-expanded={isOpen}
          aria-haspopup="listbox"
          role="combobox"
        >
          <div
            class="slds-combobox__form-element slds-input-has-icon slds-input-has-icon_right"
            role="none"
          >
            <input
              type="text"
              class="slds-input slds-combobox__input"
              role="textbox"
              placeholder={placeholder}
              value={inputValue}
              oninput={handleInput}
              onfocus={handleFocus}
              onblur={handleBlur}
              autocomplete="off"
            />
            <template if:true={showClear}>
              <button
                class="slds-button slds-button_icon slds-input__icon slds-input__icon_right"
                title="Limpar"
                onmousedown={handleClearMouseDown}
              >
                <lightning-icon
                  icon-name="utility:close"
                  size="x-small"
                ></lightning-icon>
              </button>
            </template>
          </div>
          <div
            class="slds-dropdown slds-dropdown_length-10 slds-dropdown_fluid"
            role="listbox"
          >
            <ul class="slds-listbox slds-listbox_vertical" role="presentation">
              <template if:true={showAllOption}>
                <li role="presentation" class="slds-listbox__item">
                  <div
                    class="slds-media slds-listbox__option slds-listbox__option_plain slds-media_small"
                    role="option"
                    onmousedown={handleAllOptionMouseDown}
                  >
                    <span class="slds-media__body">
                      <span class="slds-truncate">{allOptionLabel}</span>
                    </span>
                  </div>
                </li>
              </template>
              <template for:each={filteredOptions} for:item="opt">
                <li key={opt.id} role="presentation" class="slds-listbox__item">
                  <div
                    class="slds-media slds-listbox__option slds-listbox__option_plain slds-media_small"
                    role="option"
                    data-id={opt.id}
                    onmousedown={handleOptionMouseDown}
                  >
                    <span class="slds-media__body">
                      <span class="slds-truncate">{opt.label}</span>
                    </span>
                  </div>
                </li>
              </template>
              <template if:true={hasNoResults}>
                <li class="slds-listbox__item">
                  <div
                    class="slds-media slds-listbox__option slds-listbox__option_plain slds-media_small slds-text-color_weak"
                  >
                    Nenhuma categoria encontrada
                  </div>
                </li>
              </template>
            </ul>
          </div>
        </div>
      </div>
      <button
        type="button"
        class="slds-button slds-button_text add-category-trigger"
        onclick={handleOpenNewCategoryModal}
      >
        <lightning-icon
          icon-name="utility:add"
          size="xx-small"
          class="slds-m-right_xx-small"
        ></lightning-icon>
        Nova Categoria
      </button>
    </div>
  </div>

  <template if:true={isNewCategoryModalOpen}>
    <section
      role="dialog"
      tabindex="-1"
      class="slds-modal slds-fade-in-open slds-modal_small new-category-modal"
      aria-modal="true"
    >
      <div class="slds-modal__container">
        <header class="slds-modal__header">
          <button
            class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
            title="Fechar"
            onclick={handleCloseNewCategoryModal}
          >
            <lightning-icon
              icon-name="utility:close"
              size="small"
            ></lightning-icon>
            <span class="slds-assistive-text">Fechar</span>
          </button>
          <h2 class="slds-modal__title slds-hyphenate slds-text-heading_medium">
            Nova Categoria
          </h2>
        </header>
        <div class="slds-modal__content slds-p-around_medium">
          <div class="slds-form-element slds-m-bottom_small">
            <label class="slds-form-element__label" for="new-category-name"
              >Nome da Categoria</label
            >
            <div class="slds-form-element__control">
              <input
                id="new-category-name"
                type="text"
                class="slds-input"
                value={newCategoryName}
                oninput={handleNewCategoryNameChange}
                placeholder="Ex: Assinaturas"
              />
            </div>
          </div>
          <div class="slds-form-element">
            <label class="slds-form-element__label" for="new-category-parent"
              >Categoria Pai (opcional)</label
            >
            <div class="slds-form-element__control">
              <div class="slds-select_container">
                <select
                  id="new-category-parent"
                  class="slds-select"
                  value={newCategoryParentId}
                  onchange={handleNewCategoryParentChange}
                >
                  <option value="">Nenhuma (categoria principal)</option>
                  <template for:each={parentCategoryOptions} for:item="opt">
                    <option key={opt.id} value={opt.id}>
                      {opt.displayLabel}
                    </option>
                  </template>
                </select>
              </div>
            </div>
          </div>
        </div>
        <footer class="slds-modal__footer">
          <button
            class="slds-button slds-button_neutral"
            onclick={handleCloseNewCategoryModal}
            disabled={isSavingCategory}
          >
            Cancelar
          </button>
          <button
            class="slds-button slds-button_brand"
            onclick={handleSaveNewCategory}
            disabled={isSavingCategory}
          >
            <template if:true={isSavingCategory}>
              <lightning-spinner
                alternative-text="Salvando..."
                size="small"
              ></lightning-spinner>
            </template>
            Salvar
          </button>
        </footer>
      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open new-category-backdrop"></div>
  </template>
</template>
