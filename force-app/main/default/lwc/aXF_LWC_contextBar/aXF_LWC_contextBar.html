<template>
  <section class="slds-box slds-theme_default" aria-labelledby="context-title">
    <h2 id="context-title" class="slds-text-title_bold slds-m-bottom_x-small">
      {labels.TITLE}
    </h2>
    <template lwc:if={loading}>
      <lightning-spinner
        alternative-text="Carregando contextos"
      ></lightning-spinner>
    </template>
    <template lwc:elseif={error}>
      <div role="alert">
        <p>{labels.ERROR}</p>
        <lightning-button
          label={labels.RETRY}
          onclick={handleRetry}
        ></lightning-button>
      </div>
    </template>
    <template lwc:elseif={isEmpty}>
      <p role="status">{labels.EMPTY}</p>
    </template>
    <template lwc:elseif={isReady}>
      <lightning-combobox
        name="authorizedContext"
        label={labels.LABEL}
        placeholder={labels.PLACEHOLDER}
        options={options}
        value={selectedId}
        onchange={handleChange}
      ></lightning-combobox>
    </template>
    <p class="slds-assistive-text" aria-live="polite">{announcement}</p>
  </section>
</template>
