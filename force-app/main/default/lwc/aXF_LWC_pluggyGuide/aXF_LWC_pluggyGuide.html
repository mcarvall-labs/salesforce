<template>
  <div class="guide" role="group" aria-label={chrome.title}>
    <header class="guide__head">
      <p class="guide__eyebrow">{chrome.title}</p>
      <h2 class="guide__title" tabindex="-1" data-step-heading>
        {content.title}
      </h2>
      <div
        class="guide__progress"
        role="progressbar"
        aria-valuemin="1"
        aria-valuemax={total}
        aria-valuenow={humanIndex}
        aria-label={progressLabel}
      >
        <span class="guide__progress-bar" style={progressStyle}></span>
      </div>
      <p class="guide__step-of">{progressLabel}</p>
    </header>

    <div class="guide__body">
      <template for:each={bodyParagraphs} for:item="p">
        <p key={p.key} class="guide__text">{p.text}</p>
      </template>

      <template if:true={officialLink}>
        <a
          class="guide__link"
          href={officialLink}
          target="_blank"
          rel="noopener noreferrer"
        >
          {chrome.openLink}
          <span class="guide__link-url"> ({officialLink})</span>
        </a>
      </template>

      <template if:true={hasAction}>
        <button type="button" class="guide__action" onclick={handleAction}>
          {actionLabel}
        </button>
      </template>

      <template if:true={hasMedia}>
        <figure class="guide__media">
          <svg
            class="guide__figure"
            viewBox={figureViewBox}
            role="img"
            aria-label={mediaAlt}
            preserveAspectRatio="xMidYMid meet"
          >
            <rect
              class="guide__figure-win"
              x="1"
              y="1"
              width="318"
              height="30"
              rx="4"
            ></rect>
            <circle class="guide__figure-dot" cx="14" cy="16" r="3"></circle>
            <circle class="guide__figure-dot" cx="26" cy="16" r="3"></circle>
            <circle class="guide__figure-dot" cx="38" cy="16" r="3"></circle>
            <text class="guide__figure-title" x="52" y="20">
              {figureWindow}
            </text>
            <template for:each={figureControls} for:item="c">
              <g key={c.key} class={c.chipClass}>
                <rect
                  class="guide__chip-box"
                  x="16"
                  y={c.y}
                  width="288"
                  height="22"
                  rx="11"
                ></rect>
                <circle
                  class="guide__chip-num"
                  cx="31"
                  cy={c.midY}
                  r="8"
                ></circle>
                <text class="guide__chip-n" x="31" y={c.midY}>{c.n}</text>
                <text class="guide__chip-label" x="47" y={c.midY}>
                  {c.label}
                </text>
              </g>
            </template>
          </svg>
          <p class="guide__figure-tag">{chrome.figureTag}</p>
          <figcaption class="guide__media-caption">{mediaAlt}</figcaption>

          <template if:true={hasAnimation}>
            <div class="guide__anim-controls">
              <button
                type="button"
                class="guide__anim-btn"
                onclick={togglePlay}
                aria-pressed={animationPlaying}
              >
                {playPauseLabel}
              </button>
              <button type="button" class="guide__anim-btn" onclick={replay}>
                {chrome.replay}
              </button>
            </div>
            <p class="guide__note">{chrome.animationStaticNote}</p>
          </template>
          <template if:true={showReducedMotionNote}>
            <p class="guide__note" role="note">{chrome.reducedMotionNote}</p>
          </template>
        </figure>
      </template>

      <template if:true={hasHelp}>
        <div class="guide__help">
          <button
            type="button"
            class="guide__help-toggle"
            onclick={toggleHelp}
            aria-expanded={helpOpen}
          >
            {helpToggleLabel}
          </button>
          <template if:true={helpOpen}>
            <ul class="guide__help-list">
              <template for:each={helpParagraphs} for:item="h">
                <li key={h.key}>{h.text}</li>
              </template>
            </ul>
          </template>
        </div>
      </template>
    </div>

    <footer class="guide__nav">
      <button
        type="button"
        class="guide__nav-btn"
        data-nav="back"
        onclick={handleBack}
        disabled={isFirst}
      >
        {chrome.back}
      </button>
      <button
        type="button"
        class="guide__nav-btn guide__nav-btn_primary"
        data-nav="next"
        data-last={isLast}
        onclick={handleNext}
      >
        {nextLabel}
      </button>
    </footer>
  </div>
</template>
