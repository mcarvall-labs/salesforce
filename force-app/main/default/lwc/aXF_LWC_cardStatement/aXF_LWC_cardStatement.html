<template>
  <lightning-card title={labels.title} icon-name="custom:custom40">
    <div class="slds-var-p-horizontal_medium">
      <p class="slds-var-m-bottom_small">{labels.intro}</p>

      <div aria-live="polite">
        <template lwc:if={message}>
          <div class={messageClass} role="status" tabindex="-1" data-message>
            {message}
          </div>
        </template>
      </div>

      <template lwc:if={loading}>
        <lightning-spinner
          alternative-text={labels.loading}
          size="small"
        ></lightning-spinner>
      </template>

      <template lwc:if={error}>
        <p class="slds-text-color_error" role="alert">{error}</p>
      </template>

      <template lwc:if={noCapability}>
        <p class="slds-text-color_weak" data-no-capability>
          {labels.noCapability}
        </p>
      </template>

      <template lwc:if={showNoCards}>
        <p class="slds-text-color_weak" data-no-cards>{labels.noCards}</p>
      </template>

      <template lwc:if={hasCards}>
        <table
          class="slds-table slds-table_cell-buffer slds-table_bordered slds-var-m-bottom_medium"
          data-cards
        >
          <caption class="slds-text-heading_small slds-text-align_left">
            {labels.cardsCaption}
          </caption>
          <thead>
            <tr class="slds-line-height_reset">
              <th scope="col">{labels.colCard}</th>
              <th scope="col">{labels.colHolder}</th>
              <th scope="col" class="slds-text-align_right">
                {labels.colCreditLimit}
              </th>
              <th scope="col" class="slds-text-align_right">
                {labels.colAvailableLimit}
              </th>
              <th scope="col">{labels.colClosingDay}</th>
              <th scope="col">{labels.colDueDay}</th>
              <th scope="col">{labels.colActions}</th>
            </tr>
          </thead>
          <tbody>
            <template for:each={cardRows} for:item="card">
              <tr key={card.key} class={card.rowClass} data-card-row={card.key}>
                <th scope="row">{card.name}</th>
                <td>{card.holderLabel}</td>
                <td class="slds-text-align_right" data-credit-limit>
                  <template lwc:if={card.hasCreditLimit}>
                    <lightning-formatted-number
                      value={card.creditLimit}
                      format-style="currency"
                      currency-code={card.currencyIso}
                    ></lightning-formatted-number>
                  </template>
                  <template lwc:else>{labels.notAvailable}</template>
                </td>
                <td class="slds-text-align_right" data-available-limit>
                  <template lwc:if={card.hasAvailableLimit}>
                    <lightning-formatted-number
                      value={card.availableLimit}
                      format-style="currency"
                      currency-code={card.currencyIso}
                    ></lightning-formatted-number>
                  </template>
                  <template lwc:else>{labels.notAvailable}</template>
                </td>
                <template lwc:if={card.editing}>
                  <td>
                    <lightning-input
                      type="number"
                      step="1"
                      min="1"
                      max="31"
                      label={labels.closingDayInput}
                      value={closingDraft.closingDay}
                      data-card={card.key}
                      data-closing="closingDay"
                      onchange={handleClosingChange}
                      required
                    ></lightning-input>
                  </td>
                  <td>
                    <lightning-input
                      type="number"
                      step="1"
                      min="1"
                      max="31"
                      label={labels.dueDayInput}
                      value={closingDraft.dueDay}
                      data-card={card.key}
                      data-closing="dueDay"
                      onchange={handleClosingChange}
                      required
                    ></lightning-input>
                  </td>
                </template>
                <template lwc:else>
                  <td data-closing-day>{card.closingText}</td>
                  <td data-due-day>{card.dueText}</td>
                </template>
                <td>
                  <lightning-button-group>
                    <lightning-button
                      label={labels.viewInvoice}
                      title={card.viewLabel}
                      data-id={card.key}
                      data-action="view"
                      onclick={handleSelect}
                    ></lightning-button>
                    <template lwc:if={card.showDefine}>
                      <lightning-button
                        label={labels.defineClosing}
                        title={card.defineLabel}
                        data-id={card.key}
                        data-action="define-closing"
                        onclick={handleDefineClosing}
                      ></lightning-button>
                    </template>
                    <template lwc:if={card.editing}>
                      <lightning-button
                        variant="brand"
                        label={labels.save}
                        data-id={card.key}
                        data-action="save-closing"
                        disabled={card.busy}
                        onclick={handleSaveClosing}
                      ></lightning-button>
                      <lightning-button
                        label={labels.cancel}
                        data-action="cancel-closing"
                        onclick={handleCancelClosing}
                      ></lightning-button>
                    </template>
                  </lightning-button-group>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
      </template>

      <template lwc:if={selectedId}>
        <section aria-labelledby="axf152-invoice-heading" data-invoice>
          <div class="slds-grid slds-grid_vertical-align-center slds-wrap">
            <lightning-button-icon
              icon-name="utility:chevronleft"
              alternative-text={labels.previousInvoice}
              title={labels.previousInvoice}
              data-action="previous"
              onclick={handlePrevious}
            ></lightning-button-icon>
            <h2
              id="axf152-invoice-heading"
              class="slds-text-heading_small slds-var-m-horizontal_small"
              data-period
            >
              {periodLabel}
            </h2>
            <lightning-button-icon
              icon-name="utility:chevronright"
              alternative-text={labels.nextInvoice}
              title={labels.nextInvoice}
              data-action="next"
              onclick={handleNext}
            ></lightning-button-icon>
            <div class="slds-col_bump-left">
              <lightning-button
                variant="brand"
                label={labels.newExpense}
                data-action="new-expense"
                onclick={handleNewExpense}
              ></lightning-button>
            </div>
          </div>

          <template lwc:if={invoice}>
            <template lwc:if={isBlocked}>
              <div
                class="slds-notify slds-notify_alert slds-alert_warning slds-var-m-vertical_small"
                role="status"
                data-no-calendar
              >
                {labels.noCalendar}
              </div>
            </template>
            <ul
              class="slds-list_horizontal slds-has-dividers_right slds-wrap slds-var-m-vertical_small"
              data-summary
            >
              <template lwc:if={windowText}>
                <li class="slds-item" data-window>{windowText}</li>
              </template>
              <template lwc:if={isResolved}>
                <li class="slds-item" data-closing>{closingText}</li>
                <li class="slds-item" data-due>{dueText}</li>
              </template>
              <li class="slds-item" data-total>
                <span class="slds-text-color_weak">{labels.total}:</span>
                <lightning-formatted-number
                  class="slds-var-m-left_xx-small"
                  value={invoice.total}
                  format-style="currency"
                  currency-code={invoiceCurrency}
                ></lightning-formatted-number>
                <template lwc:if={invoice.truncated}>
                  <span
                    class="slds-badge slds-theme_warning slds-var-m-left_x-small"
                    data-total-partial
                    >{labels.totalPartial}</span
                  >
                </template>
              </li>
              <template lwc:if={invoice.mixedCurrency}>
                <li class="slds-item slds-text-color_weak" data-mixed-currency>
                  {labels.mixedCurrency}
                </li>
              </template>
              <template lwc:if={hasPlanned}>
                <li class="slds-item" data-planned-total>
                  <span class="slds-text-color_weak"
                    >{labels.plannedTotal}:</span
                  >
                  <lightning-formatted-number
                    class="slds-var-m-left_xx-small"
                    value={invoice.plannedTotal}
                    format-style="currency"
                    currency-code={invoiceCurrency}
                  ></lightning-formatted-number>
                </li>
              </template>
            </ul>
          </template>

          <fieldset class="slds-form-element slds-var-m-vertical_small">
            <legend class="slds-form-element__legend slds-form-element__label">
              {labels.filtersLegend}
            </legend>
            <div class="slds-grid slds-wrap slds-gutters_x-small">
              <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-6">
                <lightning-input
                  type="date"
                  label={labels.fromDate}
                  value={draftFilters.fromDate}
                  data-field="fromDate"
                  data-filter
                  onchange={handleFilterChange}
                ></lightning-input>
              </div>
              <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-6">
                <lightning-input
                  type="date"
                  label={labels.toDate}
                  value={draftFilters.toDate}
                  data-field="toDate"
                  data-filter
                  onchange={handleFilterChange}
                ></lightning-input>
              </div>
              <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-6">
                <lightning-input
                  type="number"
                  step="0.01"
                  min="0"
                  label={labels.minAmount}
                  value={draftFilters.minAmount}
                  data-field="minAmount"
                  data-filter
                  onchange={handleFilterChange}
                ></lightning-input>
              </div>
              <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-6">
                <lightning-input
                  type="number"
                  step="0.01"
                  min="0"
                  label={labels.maxAmount}
                  value={draftFilters.maxAmount}
                  data-field="maxAmount"
                  data-filter
                  onchange={handleFilterChange}
                ></lightning-input>
              </div>
              <div class="slds-col slds-size_1-of-1 slds-medium-size_2-of-6">
                <lightning-input
                  type="search"
                  label={labels.term}
                  value={draftFilters.term}
                  maxlength="100"
                  data-field="term"
                  data-filter
                  onchange={handleFilterChange}
                ></lightning-input>
              </div>
            </div>
            <div class="slds-var-m-top_x-small">
              <lightning-button
                label={labels.applyFilters}
                data-action="apply-filters"
                onclick={handleApplyFilters}
              ></lightning-button>
              <lightning-button
                class="slds-var-m-left_x-small"
                variant="base"
                label={labels.clearFilters}
                data-action="clear-filters"
                onclick={handleClearFilters}
              ></lightning-button>
            </div>
          </fieldset>

          <template lwc:if={invoiceLoading}>
            <lightning-spinner
              alternative-text={labels.loading}
              size="small"
            ></lightning-spinner>
          </template>

          <template lwc:if={invoice}>
            <template lwc:if={invoice.truncated}>
              <p class="slds-text-color_weak" role="status">
                {labels.truncated}
              </p>
            </template>
          </template>

          <template lwc:if={showNoLines}>
            <p class="slds-text-color_weak" data-no-lines>{labels.noLines}</p>
          </template>

          <template lwc:if={hasLines}>
            <table
              class="slds-table slds-table_cell-buffer slds-table_bordered"
              data-lines
            >
              <caption class="slds-assistive-text">
                {invoiceCaption}
              </caption>
              <thead>
                <tr class="slds-line-height_reset">
                  <th scope="col">{labels.colDate}</th>
                  <th scope="col">{labels.colDescription}</th>
                  <th scope="col">{labels.colOrigin}</th>
                  <th scope="col" class="slds-text-align_right">
                    {labels.colAmount}
                  </th>
                  <th scope="col">{labels.colStatus}</th>
                  <th scope="col">{labels.colActions}</th>
                </tr>
              </thead>
              <tbody>
                <template for:each={lineRows} for:item="line">
                  <tr key={line.key} data-line={line.key}>
                    <td>{line.dateText}</td>
                    <th scope="row" class="slds-cell-wrap">
                      {line.description}
                    </th>
                    <td>{line.originLabel}</td>
                    <td class="slds-text-align_right">
                      <lightning-formatted-number
                        value={line.signedAmount}
                        format-style="currency"
                        currency-code={line.currencyIso}
                      ></lightning-formatted-number>
                    </td>
                    <td>
                      <span class={line.statusClass} data-status
                        >{line.statusLabel}</span
                      >
                    </td>
                    <td>
                      <template lwc:if={line.canSuggest}>
                        <lightning-button
                          variant="base"
                          label={labels.showSuggestions}
                          title={line.toggleLabel}
                          aria-expanded={line.ariaExpanded}
                          aria-controls={line.suggestionsId}
                          data-id={line.key}
                          data-action="toggle-suggestions"
                          onclick={handleToggleSuggestions}
                        ></lightning-button>
                      </template>
                    </td>
                  </tr>
                  <template lwc:if={line.expanded}>
                    <tr key={line.subKey} data-suggestions={line.key}>
                      <td colspan="6" id={line.suggestionsId}>
                        <p class="slds-text-title slds-var-m-bottom_x-small">
                          {labels.suggestionsCaption}
                        </p>
                        <template lwc:if={line.suggestionsLoading}>
                          <p role="status">{labels.loading}</p>
                        </template>
                        <template lwc:if={line.noSuggestions}>
                          <p class="slds-text-color_weak" data-no-suggestions>
                            {labels.noSuggestions}
                          </p>
                        </template>
                        <ul class="slds-list_vertical-space">
                          <template
                            for:each={line.suggestionItems}
                            for:item="s"
                          >
                            <li key={s.key}>
                              <lightning-button
                                label={s.text}
                                data-line={line.key}
                                data-index={s.index}
                                data-action="confirm-suggestion"
                                disabled={s.busy}
                                onclick={handleConfirm}
                              ></lightning-button>
                              <template lwc:if={s.tied}>
                                <span class="slds-badge slds-var-m-left_x-small"
                                  >{labels.tied}</span
                                >
                              </template>
                            </li>
                          </template>
                        </ul>
                        <template lwc:if={line.suggestionsTruncated}>
                          <p class="slds-text-color_weak">{labels.truncated}</p>
                        </template>
                      </td>
                    </tr>
                  </template>
                </template>
              </tbody>
            </table>
          </template>
        </section>
      </template>
    </div>
  </lightning-card>
</template>
