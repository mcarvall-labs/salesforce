<template>
  <lightning-card>
    <div class="wizard" role="region" aria-label={labels.title}>
      <template lwc:if={loading}>
        <div class="wizard__status">
          <lightning-spinner size="medium"></lightning-spinner>
        </div>
      </template>

      <template lwc:elseif={forbidden}>
        <div class="wizard__banner wizard__banner_error" role="status">
          {labels.forbidden}
        </div>
      </template>

      <template lwc:elseif={onDone}>
        <div class="wizard__status" role="status">
          <h2 class="wizard__title wizard__done-title slds-text-color_success">
            {labels.done}
          </h2>
          <p class="wizard__done-hint">{labels.doneHint}</p>
        </div>
        <ul class="wizard__review-list">
          <template for:each={stepRows} for:item="r">
            <li key={r.stepKey} class="wizard__review-row">
              <span>{r.label}</span>
              <span class="wizard__review-status">{r.status}</span>
              <template lwc:if={r.done}>
                <lightning-button
                  variant="base"
                  label={labels.reopen}
                  data-step={r.stepKey}
                  onclick={handleReopen}
                ></lightning-button>
              </template>
            </li>
          </template>
        </ul>
      </template>

      <template lwc:else>
        <!-- ================= stepper ================= -->
        <div class="wizard__stepper">
          <template for:each={stepperItems} for:item="st">
            <div key={st.key} class={st.cssClass}>
              <div class="wizard__step-row">
                <div class={st.leadingClass}></div>
                <div class="wizard__step-dot">
                  <template lwc:if={st.isDone}>✓</template>
                  <template lwc:else>{st.num}</template>
                </div>
                <div class={st.trailingClass}></div>
              </div>
              <span class="wizard__step-label">{st.label}</span>
            </div>
          </template>
        </div>

        <h2
          class="wizard__title slds-assistive-text"
          tabindex="-1"
          data-heading
        >
          {stepNumberLabel} — {stepTitle}
        </h2>

        <template lwc:if={message}>
          <div
            class="wizard__banner wizard__banner_error"
            role="alert"
            data-message
          >
            {message}
          </div>
        </template>
        <template lwc:if={staleDetected}>
          <div class="wizard__banner wizard__banner_notice" role="status">
            {labels.stale}
          </div>
        </template>

        <div class="wizard__card">
          <!-- ================= step content ================= -->
          <div class="wizard__body">
            <template lwc:if={onReview}>
              <ul class="wizard__review-list">
                <template for:each={stepRows} for:item="r">
                  <li
                    key={r.stepKey}
                    class="wizard__review-row"
                    data-review-row
                  >
                    <span>{r.label}</span>
                    <span class="wizard__review-status">{r.status}</span>
                  </li>
                </template>
              </ul>
              <template lwc:if={requiredPending}>
                <lightning-input
                  type="checkbox"
                  label={labels.ackPending}
                  checked={acknowledge}
                  onchange={handleAck}
                  class="slds-var-m-top_small"
                ></lightning-input>
              </template>
            </template>

            <template lwc:else>
              <template lwc:if={showWelcome}>
                <p class="wizard__welcome">{labels.welcome}</p>
              </template>
              <template lwc:if={showPluggyGuide}>
                <div class="wizard__guide-bar">
                  <lightning-button
                    variant="brand-outline"
                    icon-name="utility:help"
                    label={labels.guideOpen}
                    data-guide-open
                    onclick={openGuide}
                  ></lightning-button>
                </div>
                <c-a-x-f_-l-w-c_pluggy-integration-config
                  onstatuschange={handlePluggyStatusChange}
                ></c-a-x-f_-l-w-c_pluggy-integration-config>

                <template lwc:if={guideOpen}>
                  <section
                    class="wizard__modal"
                    role="dialog"
                    aria-modal="true"
                    aria-label={labels.guideOpen}
                    onclick={handleGuideBackdrop}
                    onkeydown={handleGuideKeydown}
                  >
                    <div class="wizard__modal-box">
                      <button
                        class="wizard__modal-close"
                        type="button"
                        title={labels.guideClose}
                        aria-label={labels.guideClose}
                        onclick={closeGuide}
                      >
                        &times;
                      </button>
                      <c-a-x-f_-l-w-c_pluggy-guide
                        onguidecomplete={closeGuide}
                        onopensecureform={closeGuide}
                      ></c-a-x-f_-l-w-c_pluggy-guide>
                    </div>
                  </section>
                </template>
              </template>
              <template lwc:if={showDiscovery}>
                <c-a-x-f_-l-w-c_source-discovery></c-a-x-f_-l-w-c_source-discovery>
              </template>
              <template lwc:if={showHolders}>
                <c-a-x-f_-l-w-c_confirm-source-holders></c-a-x-f_-l-w-c_confirm-source-holders>
              </template>
              <template lwc:if={showPeopleAccess}>
                <c-a-x-f_-l-w-c_add-person-access></c-a-x-f_-l-w-c_add-person-access>
              </template>
              <template lwc:if={showManualSources}>
                <c-a-x-f_-l-w-c_manual-financial-source
                  allow-skip
                ></c-a-x-f_-l-w-c_manual-financial-source>
              </template>
              <template lwc:if={showCurrency}>
                <c-a-x-f_-l-w-c_report-currency-preference></c-a-x-f_-l-w-c_report-currency-preference>
              </template>
            </template>
          </div>

          <!-- ================= navigation ================= -->
          <div class="wizard__nav">
            <lightning-button
              label={labels.back}
              onclick={handleBack}
              disabled={isFirst}
            ></lightning-button>
            <div class="wizard__nav-secondary">
              <template lwc:if={isOptional}>
                <lightning-button
                  label={labels.skip}
                  onclick={handleSkip}
                  disabled={busy}
                ></lightning-button>
              </template>
              <template lwc:if={onReview}>
                <lightning-button
                  variant="brand"
                  label={labels.finish}
                  onclick={handleFinish}
                  disabled={finishDisabled}
                ></lightning-button>
              </template>
              <template lwc:else>
                <template lwc:if={pluggyBlocked}>
                  <span
                    class="slds-text-body_small slds-text-color_weak slds-var-m-right_small"
                    role="status"
                  >
                    {labels.pluggyNotConfigured}
                  </span>
                </template>
                <lightning-button
                  variant="brand"
                  label={nextLabel}
                  title={nextTitle}
                  onclick={handleNext}
                  disabled={nextDisabled}
                ></lightning-button>
              </template>
            </div>
          </div>
        </div>
      </template>
    </div>
  </lightning-card>
</template>
