<template>
  <div class="picker">
    <lightning-input
      class="category-search"
      type="search"
      label={label}
      placeholder="Digite para filtrar, ex.: Moradia ou Energia"
      value={inputValue}
      autocomplete="off"
      onfocus={handleFocus}
      onblur={handleBlur}
      onchange={handleInput}
      onkeydown={handleKeydown}
    ></lightning-input>
    <template lwc:if={isOpen}>
      <ul class="list" role="listbox" aria-label={label}>
        <template for:each={rows} for:item="row">
          <li
            key={row.key}
            class={row.className}
            role="option"
            aria-selected={row.selected}
            data-id={row.id}
            onmousedown={handleSelect}
          >
            {row.label}
          </li>
        </template>
        <template lwc:if={hasRows}></template>
        <template lwc:else>
          <li class="option option_dim" role="presentation">
            Nenhuma categoria encontrada
          </li>
        </template>
        <template lwc:if={canCreate}>
          <li
            class="option option_new"
            role="option"
            onmousedown={handleCreate}
          >
            {createLabel}
          </li>
        </template>
        <template lwc:if={value}>
          <li
            class="option option_clear"
            role="option"
            onmousedown={handleClear}
          >
            Sem categoria
          </li>
        </template>
      </ul>
    </template>
  </div>
</template>
