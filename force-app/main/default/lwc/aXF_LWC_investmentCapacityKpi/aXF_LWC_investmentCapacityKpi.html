<template>
    <div class="slds-card slds-p-around_medium investment-card-container slds-is-relative">
        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Atualizando..." size="medium" variant="brand"></lightning-spinner>
        </template>

        <!-- Filtro por Conta Bancária via Tabs SLDS (markup manual, sem lightning-tabset) -->
        <div class="slds-tabs_default">
            <ul class="slds-tabs_default__nav" role="tablist">
                <li class={geralTabItemClass} title="Geral" role="presentation">
                    <a
                        class="slds-tabs_default__link"
                        href="javascript:void(0);"
                        role="tab"
                        tabindex="0"
                        aria-selected={geralTabAriaSelected}
                        data-id="ALL"
                        onclick={handleTabClick}
                    >Geral</a>
                </li>
                <template for:each={accountHolderTabs} for:item="holder">
                    <li key={holder.id} class={holder.tabItemClass} title={holder.name} role="presentation">
                        <a
                            class="slds-tabs_default__link"
                            href="javascript:void(0);"
                            role="tab"
                            tabindex="-1"
                            aria-selected={holder.ariaSelected}
                            data-id={holder.id}
                            onclick={handleTabClick}
                        >{holder.name}</a>
                    </li>
                </template>
            </ul>
        </div>

        <!-- Conteúdo do KPI (compartilhado — reflete sempre a Conta selecionada) -->
        <div class="slds-m-top_medium">
            <!-- Main Banner KPI -->
            <div class="investment-banner slds-p-around_medium slds-m-bottom_medium slds-is-relative">
                <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                    <p class="slds-text-title_bold text-uppercase">Saldo Projetado</p>
                    <lightning-button-icon
                        icon-name="utility:refresh"
                        variant="border-filled"
                        size="small"
                        onclick={handleRefresh}
                        disabled={isLoading}
                        alternative-text="Atualizar"
                        title="Atualizar">
                    </lightning-button-icon>
                </div>
                <h1 class="slds-text-heading_large slds-font-weight_bold text-investment-total slds-m-top_xx-small">
                    <lightning-formatted-number value={metrics.totalInvestmentCapacity} format-style="currency" currency-code="BRL"></lightning-formatted-number>
                </h1>
                <p class="slds-text-body_small slds-m-top_xx-small text-muted">
                    Consolidação de saldo em contas + sobra líquida do fluxo de caixa do mês.
                </p>
            </div>

            <!-- Metric Breakdown Cards -->
            <div class="slds-grid slds-wrap slds-gutters">
                <!-- Saldo Total em Contas -->
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-m-bottom_small">
                    <div class="slds-box slds-p-around_small metric-box">
                        <div class="slds-grid slds-grid_vertical-align-start">
                            <div class="slds-m-right_small">
                                <lightning-icon icon-name="standard:company" size="medium"></lightning-icon>
                            </div>
                            <div>
                                <p class="slds-text-title slds-text-color_weak">Saldo Total em Contas</p>
                                <h4 class="slds-text-heading_small slds-font-weight_bold slds-m-top_xx-small">
                                    <lightning-formatted-number value={metrics.bankAccountsBalance} format-style="currency" currency-code="BRL"></lightning-formatted-number>
                                </h4>
                            </div>
                        </div>

                        <div class="slds-m-vertical_small border-top"></div>

                        <template if:true={hasPositiveAccounts}>
                            <div class="positive-accounts-list">
                                <template for:each={metrics.positiveBankAccounts} for:item="acc">
                                    <div key={acc.id} data-id={acc.id} onclick={handleAccountClick} class="slds-grid slds-grid_align-spread slds-text-body_small slds-p-vertical_xx-small account-row" title="Clique para abrir o registro">
                                        <span class="account-name slds-truncate">{acc.name}</span>
                                        <span class="account-balance slds-font-weight_bold slds-m-left_x-small">
                                            <lightning-formatted-number value={acc.balance} format-style="currency" currency-code="BRL"></lightning-formatted-number>
                                        </span>
                                    </div>
                                </template>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- Sobra Prevista do Mês -->
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-m-bottom_small">
                    <div class="slds-box slds-p-around_small metric-box">
                        <div class="slds-media slds-media_center">
                            <div class="slds-media__figure">
                                <lightning-icon icon-name="utility:trending" size="small" variant="success"></lightning-icon>
                            </div>
                            <div class="slds-media__body">
                                <p class="slds-text-title slds-text-color_weak">Sobra Projetada do Mês</p>
                                <h4 class="slds-text-heading_small slds-font-weight_bold slds-m-top_xx-small">
                                    <lightning-formatted-number value={metrics.monthProjectedSurplus} format-style="currency" currency-code="BRL"></lightning-formatted-number>
                                </h4>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</template>
