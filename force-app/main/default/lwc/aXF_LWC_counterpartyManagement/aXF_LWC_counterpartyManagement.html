<template>
  <lightning-card title="Contrapartes e Contratos" icon-name="standard:contract">
    <!-- Ações no cabeçalho -->
    <div slot="actions" class="slds-grid slds-grid_vertical-align-center slds-gutters_x-small">
      <div class="slds-col" if:true={hasEntities}>
        <lightning-combobox
          name="entitySelector"
          label="Entidade Titular"
          variant="label-hidden"
          placeholder="Selecione a Entidade"
          value={selectedAccountId}
          options={entityOptions}
          onchange={handleEntityChange}
          class="slds-m-right_x-small"
          style="min-width: 220px;"
        ></lightning-combobox>
      </div>
      <div class="slds-col">
        <lightning-button
          variant="brand"
          label="Nova contraparte ou relação"
          icon-name="utility:add"
          onclick={handleOpenNewModal}
          disabled={isNewDisabled}
        ></lightning-button>
      </div>
    </div>

    <!-- Conteúdo principal -->
    <div class="slds-p-around_medium">
      <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_medium">
        Identidades externas, relações autorizadas e termos efetivos (AXF-51, G1, G2, AD-30)
      </p>

      <!-- Feedback de erro -->
      <template if:true={errorMessage}>
        <div class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_medium" role="alert">
          <lightning-icon icon-name="utility:error" variant="inverse" size="x-small" class="slds-m-right_x-small"></lightning-icon>
          <h2>{errorMessage}</h2>
          <lightning-button-icon icon-name="utility:close" variant="bare-inverse" size="small" class="slds-notify__close" onclick={handleClearError}></lightning-button-icon>
        </div>
      </template>

      <!-- Spinner de carregamento -->
      <template if:true={isLoading}>
        <div class="slds-is-relative slds-p-around_xx-large">
          <lightning-spinner alternative-text="Carregando..." size="medium"></lightning-spinner>
        </div>
      </template>

      <!-- Grid 2 colunas -->
      <div class="layout-container" if:false={isLoading}>
        <!-- Painel esquerdo: Busca e lista -->
        <aside class="left-panel">
          <lightning-input
            type="search"
            name="searchKey"
            label="Buscar contraparte"
            placeholder="Nome, país ou papel..."
            value={searchKey}
            onchange={handleSearchChange}
            class="slds-m-bottom_small"
          ></lightning-input>

          <div class="counterparty-list">
            <template if:true={hasCounterparties}>
              <template for:each={counterparties} for:item="c">
                <a
                  key={c.counterpartyId}
                  class={c.cssClass}
                  data-id={c.counterpartyId}
                  onclick={handleSelectCounterparty}
                  href="javascript:void(0);"
                  role="button"
                  tabindex="0"
                >
                  <div class="slds-grid slds-grid_align-spread slds-m-bottom_xx-small">
                    <strong class="slds-truncate">{c.displayName}</strong>
                    <span class="slds-badge slds-theme_success" if:true={c.isActive}>Ativa</span>
                    <span class="slds-badge slds-theme_shade" if:false={c.isActive}>Inativa</span>
                  </div>
                  <div class="slds-text-body_small slds-text-color_weak slds-truncate">
                    {c.country} · {c.relationshipRole}
                  </div>
                  <div class="slds-text-body_small slds-text-color_weak" if:true={c.maskedTaxId}>
                    {c.taxScheme}: {c.maskedTaxId}
                  </div>
                </a>
              </template>
            </template>

            <template if:false={hasCounterparties}>
              <div class="slds-text-align_center slds-p-around_medium slds-text-color_weak">
                <lightning-icon icon-name="utility:sentiment_neutral" size="small" class="slds-m-bottom_x-small"></lightning-icon>
                <p>Nenhuma contraparte encontrada para esta entidade.</p>
              </div>
            </template>
          </div>
        </aside>

        <!-- Painel direito: Detalhes e Relação -->
        <main class="right-panel">
          <template if:true={selectedDetail}>
            <div class="detail-card">
              <!-- Cabeçalho do detalhe -->
              <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-start slds-border_bottom slds-p-bottom_medium">
                <div>
                  <h2 class="slds-text-heading_medium slds-m-bottom_xx-small">{selectedDetail.displayName}</h2>
                  <div class="slds-grid slds-grid_vertical-align-center slds-has-flexi-truncate">
                    <span class="slds-badge slds-theme_success slds-m-right_x-small">{selectedDetail.relationshipStatus}</span>
                    <span class="slds-text-body_small slds-text-color_weak">
                      {selectedDetail.kindLabel} · País: {selectedDetail.country}
                    </span>
                    <span class="slds-text-body_small slds-text-color_weak slds-m-left_x-small" if:true={selectedDetail.maskedTaxId}>
                      · {selectedDetail.taxScheme}: <strong>{selectedDetail.maskedTaxId}</strong>
                    </span>
                  </div>
                  <p class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">
                    Razão Social: <em>{selectedDetail.legalName}</em>
                  </p>
                </div>
                <div>
                  <lightning-button
                    label="Editar relação"
                    icon-name="utility:edit"
                    onclick={handleOpenEditModal}
                  ></lightning-button>
                </div>
              </div>

              <!-- Fatos da relação com esta Entidade -->
              <div class="facts-grid">
                <div class="fact-box">
                  <span class="fact-label">Relação com</span>
                  <div class="fact-value">{selectedDetail.entityName}</div>
                </div>
                <div class="fact-box">
                  <span class="fact-label">Papel da Contraparte</span>
                  <div class="fact-value">{selectedDetail.roleLabel}</div>
                </div>
                <div class="fact-box">
                  <span class="fact-label">Vigência</span>
                  <div class="fact-value">{selectedDetail.validityText}</div>
                </div>
                <div class="fact-box">
                  <span class="fact-label">Endereço Contratual <span class="protected-badge">Protegido</span></span>
                  <div class="fact-value">{selectedDetail.addressDisplay}</div>
                </div>
                <div class="fact-box">
                  <span class="fact-label">Contato Específico <span class="protected-badge">Restrito</span></span>
                  <div class="fact-value">
                    <div>{selectedDetail.contactName}</div>
                    <div if:true={selectedDetail.email}>{selectedDetail.email}</div>
                    <div if:true={selectedDetail.phone}>{selectedDetail.phone}</div>
                  </div>
                </div>
              </div>

              <!-- Sessão de Contratos -->
              <div class="slds-m-top_large">
                <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_small">
                  <div>
                    <h3 class="slds-text-heading_small">Contratos com esta Entidade</h3>
                    <p class="slds-text-body_small slds-text-color_weak">
                      A identidade da contraparte é separada das condições comerciais (AXF-52).
                    </p>
                  </div>
                  <lightning-button label="Novo contrato" icon-name="utility:add" disabled></lightning-button>
                </div>
                <div class="slds-box slds-theme_shade slds-text-align_center slds-p-around_medium">
                  <p class="slds-text-color_weak">Gestão de termos e contratos habilitada a partir da US AXF-52.</p>
                </div>
              </div>

              <!-- Aviso de conformidade -->
              <div class="notice-box">
                <strong>Isolamento de identidade e relação:</strong>
                A identidade mínima canônica é reutilizada, mas os dados contratuais, endereços e condições financeiras são estritamente isolados por Entidade (AD-30, GF-32).
              </div>
            </div>
          </template>

          <template if:false={selectedDetail}>
            <div class="detail-card slds-text-align_center slds-p-around_xx-large slds-text-color_weak">
              <lightning-icon icon-name="utility:touch_action" size="large" class="slds-m-bottom_small"></lightning-icon>
              <h3 class="slds-text-heading_small">Selecione uma contraparte</h3>
              <p>Escolha uma contraparte na lista à esquerda ou cadastre uma nova para esta entidade.</p>
            </div>
          </template>
        </main>
      </div>
    </div>
  </lightning-card>

  <!-- MODAL: Cadastro / Edição de Contraparte e Relação -->
  <template if:true={isModalOpen}>
    <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_medium" aria-modal="true" aria-labelledby="modal-heading-01">
      <div class="slds-modal__container">
        <header class="slds-modal__header">
          <lightning-button-icon icon-name="utility:close" variant="bare-inverse" size="large" class="slds-modal__close" onclick={handleCloseModal}></lightning-button-icon>
          <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">{modalTitle}</h2>
          <p class="slds-text-body_small slds-text-color_weak">
            Cadastrar contraparte e contextualizá-la para a entidade {currentEntityName}
          </p>
        </header>

        <div class="slds-modal__content slds-p-around_medium">
          <!-- Seção Identidade Mínima -->
          <h3 class="slds-section__title slds-theme_shade slds-p-horizontal_small slds-p-vertical_xx-small slds-m-bottom_small">
            <span class="slds-truncate">1. Identidade Mínima Canônica (G1)</span>
          </h3>
          <div class="slds-grid slds-wrap slds-gutters_small">
            <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-m-bottom_small">
              <lightning-input label="Nome Legal (Razão Social)" value={form.legalName} onchange={handleFormChange} data-field="legalName" required></lightning-input>
            </div>
            <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-m-bottom_small">
              <lightning-input label="Nome de Exibição" value={form.displayName} onchange={handleFormChange} data-field="displayName" required></lightning-input>
            </div>
            <div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12 slds-m-bottom_small">
              <lightning-combobox label="Tipo de Contraparte" value={form.kind} options={kindOptions} onchange={handleFormChange} data-field="kind" required></lightning-combobox>
            </div>
            <div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12 slds-m-bottom_small">
              <lightning-input label="País (ISO de 2 letras)" value={form.country} onchange={handleFormChange} data-field="country" maxlength="2" placeholder="BR, PT, US..." required></lightning-input>
            </div>
            <div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12 slds-m-bottom_small">
              <lightning-combobox label="Status" value={form.status} options={statusOptions} onchange={handleFormChange} data-field="status" required></lightning-combobox>
            </div>
          </div>

          <!-- Seção Dados Fiscais Protegidos -->
          <h3 class="slds-section__title slds-theme_shade slds-p-horizontal_small slds-p-vertical_xx-small slds-m-top_small slds-m-bottom_small">
            <span class="slds-truncate">2. Identificador Fiscal Protegido (AD-30: Máscara + Digest)</span>
          </h3>
          <div class="slds-grid slds-wrap slds-gutters_small">
            <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-m-bottom_small">
              <lightning-combobox label="Esquema do Documento" value={form.taxScheme} options={taxSchemeOptions} onchange={handleFormChange} data-field="taxScheme"></lightning-combobox>
            </div>
            <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-m-bottom_small">
              <lightning-input label="Número do Documento (gera máscara + hash)" type="password" value={form.taxRawDocument} onchange={handleFormChange} data-field="taxRawDocument" placeholder="Será imediatamente mascarado"></lightning-input>
            </div>
          </div>

          <!-- Seção Relação com a Entidade -->
          <h3 class="slds-section__title slds-theme_shade slds-p-horizontal_small slds-p-vertical_xx-small slds-m-top_small slds-m-bottom_small">
            <span class="slds-truncate">3. Relação Contextualizada com {currentEntityName}</span>
          </h3>
          <div class="slds-grid slds-wrap slds-gutters_small">
            <div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12 slds-m-bottom_small">
              <lightning-combobox label="Papel na Relação" value={form.role} options={roleOptions} onchange={handleFormChange} data-field="role" required></lightning-combobox>
            </div>
            <div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12 slds-m-bottom_small">
              <lightning-input type="date" label="Válido Desde" value={form.validFrom} onchange={handleFormChange} data-field="validFrom"></lightning-input>
            </div>
            <div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12 slds-m-bottom_small">
              <lightning-input type="date" label="Válido Até" value={form.validTo} onchange={handleFormChange} data-field="validTo"></lightning-input>
            </div>
            <div class="slds-col slds-size_1-of-1 slds-m-bottom_small">
              <lightning-textarea label="Endereço Contratual Estruturado" value={form.addressSnapshot} onchange={handleFormChange} data-field="addressSnapshot" placeholder="Logradouro, número, cidade, estado, CEP..."></lightning-textarea>
            </div>
            <div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12 slds-m-bottom_small">
              <lightning-input label="Nome do Contato" value={form.contactName} onchange={handleFormChange} data-field="contactName"></lightning-input>
            </div>
            <div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12 slds-m-bottom_small">
              <lightning-input type="email" label="E-mail de Contato" value={form.email} onchange={handleFormChange} data-field="email"></lightning-input>
            </div>
            <div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12 slds-m-bottom_small">
              <lightning-input type="tel" label="Telefone de Contato" value={form.phone} onchange={handleFormChange} data-field="phone"></lightning-input>
            </div>
          </div>
        </div>

        <footer class="slds-modal__footer">
          <lightning-button label="Cancelar" onclick={handleCloseModal} class="slds-m-right_x-small"></lightning-button>
          <lightning-button variant="brand" label="Salvar contraparte e relação" onclick={handleSaveForm} disabled={isSaving}></lightning-button>
        </footer>
      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>
</template>
