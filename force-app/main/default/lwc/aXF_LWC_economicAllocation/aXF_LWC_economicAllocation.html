<template>
  <lightning-card
    title={labels.title}
    icon-name="standard:partner_fund_allocation"
  >
    <div class="slds-var-p-horizontal_medium">
      <p class="slds-text-body_small slds-var-m-bottom_small">{labels.intro}</p>
      <div role="status" aria-live="polite" class="slds-var-m-bottom_small">
        <template lwc:if={busy}>
          <lightning-spinner
            alternative-text={labels.loading}
            size="small"
            variant="brand"
          ></lightning-spinner>
        </template>
        <template lwc:if={error}>
          <div
            class="slds-notify slds-notify_alert slds-alert_error"
            role="alert"
            data-id="error"
          >
            <span>{error}</span>
            <template lwc:if={hasReasons}>
              <ul class="slds-list_dotted slds-var-m-left_small">
                <template for:each={reasons} for:item="reason">
                  <li key={reason}>{reason}</li>
                </template>
              </ul>
            </template>
          </div>
        </template>
        <template lwc:if={success}>
          <div
            class="slds-notify slds-notify_alert slds-alert_success"
            data-id="success"
          >
            <span>{success}</span>
          </div>
        </template>
      </div>

      <template lwc:if={confirmation}>
        <section
          role="dialog"
          aria-modal="true"
          aria-labelledby="ea-confirm-title"
          class="slds-box slds-theme_warning slds-var-m-bottom_small"
          data-id="confirmation"
        >
          <h2 id="ea-confirm-title" class="slds-text-heading_small">
            {labels.confirmTitle}
          </h2>
          <p class="slds-var-m-vertical_x-small">{confirmationBody}</p>
          <lightning-button
            variant="brand"
            label={labels.yes}
            onclick={acceptConfirmation}
            data-id="confirm-yes"
          ></lightning-button>
          <lightning-button
            label={labels.cancel}
            onclick={cancelConfirmation}
            class="slds-var-m-left_x-small"
            data-id="confirm-no"
          ></lightning-button>
        </section>
      </template>

      <template lwc:if={showComposer}>
        <div class="axf-table-wrap">
          <table
            class="slds-table slds-table_cell-buffer slds-table_bordered"
            aria-label={labels.share}
          >
            <thead>
              <tr class="slds-line-height_reset">
                <th scope="col">{labels.person}</th>
                <th scope="col">{labels.percent}</th>
                <th scope="col"></th>
              </tr>
            </thead>
            <tbody>
              <template for:each={shareRows} for:item="row">
                <tr key={row.index} class="slds-hint-parent">
                  <td>
                    <lightning-combobox
                      label={labels.person}
                      variant="label-hidden"
                      value={row.accountId}
                      options={holderOptions}
                      data-index={row.index}
                      data-field="accountId"
                      onchange={handleShareField}
                    ></lightning-combobox>
                  </td>
                  <td>
                    <lightning-input
                      type="number"
                      step="0.000001"
                      min="0"
                      max="100"
                      label={labels.percent}
                      variant="label-hidden"
                      value={row.percent}
                      data-index={row.index}
                      data-field="percent"
                      onchange={handleShareField}
                    ></lightning-input>
                  </td>
                  <td>
                    <lightning-button
                      label={labels.removeShare}
                      data-index={row.index}
                      onclick={removeShare}
                    ></lightning-button>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
        <div
          class="slds-grid slds-grid_vertical-align-center slds-var-m-top_x-small"
        >
          <lightning-button
            label={labels.addShare}
            onclick={addShare}
            data-id="add"
          ></lightning-button>
          <span class="slds-var-m-left_medium">
            {labels.total}:
            <strong class={totalClass} data-id="total">{total}%</strong>
          </span>
          <lightning-button
            class="slds-var-m-left_medium"
            variant="brand"
            label={labels.propose}
            onclick={handlePropose}
            disabled={proposeDisabled}
            data-id="propose"
          ></lightning-button>
        </div>
      </template>

      <h2 class="slds-text-heading_small slds-var-m-top_medium">
        {labels.revisions}
      </h2>
      <template lwc:if={hasSets}>
        <template for:each={sets} for:item="set">
          <section
            key={set.setId}
            class="slds-box slds-var-m-top_x-small"
            data-id={set.setId}
          >
            <div class="slds-grid slds-wrap slds-grid_vertical-align-center">
              <div class="slds-col slds-size_1-of-1 slds-medium-size_2-of-3">
                <strong>{labels.revision} {set.revision}</strong> · {set.state}
                · {labels.fact} {set.factName} · {labels.holder}
                {set.holderAccountName} ·
                <lightning-formatted-number
                  value={set.factMagnitude}
                  minimum-fraction-digits="2"
                ></lightning-formatted-number>
                {set.currencyIso}
                <template lwc:if={set.effectiveAt}>
                  · {labels.effectiveAt}
                  <lightning-formatted-date-time
                    value={set.effectiveAt}
                  ></lightning-formatted-date-time>
                </template>
              </div>
              <div
                class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3 slds-text-align_right"
              >
                <template lwc:if={set.isDraft}>
                  <lightning-button
                    variant="brand"
                    label={labels.confirm}
                    data-id={set.setId}
                    onclick={askConfirm}
                    disabled={busy}
                  ></lightning-button>
                </template>
              </div>
            </div>
            <div class="axf-table-wrap">
              <table
                class="slds-table slds-table_cell-buffer slds-table_bordered slds-var-m-top_x-small"
                aria-label={labels.share}
              >
                <thead>
                  <tr class="slds-line-height_reset">
                    <th scope="col">{labels.person}</th>
                    <th scope="col">{labels.percent}</th>
                    <th scope="col">{labels.amount}</th>
                  </tr>
                </thead>
                <tbody>
                  <template for:each={set.shares} for:item="share">
                    <tr key={share.allocationId} class="slds-hint-parent">
                      <td>{share.accountName}</td>
                      <td>{share.percent}%</td>
                      <td>
                        <lightning-formatted-number
                          value={share.magnitude}
                          minimum-fraction-digits="2"
                        ></lightning-formatted-number>
                        {share.currencyIso}
                      </td>
                    </tr>
                  </template>
                  <tr>
                    <td><strong>{labels.total}</strong></td>
                    <td><strong>{set.totalPercent}%</strong></td>
                    <td></td>
                  </tr>
                </tbody>
              </table>
            </div>
          </section>
        </template>
      </template>
      <template lwc:else>
        <p class="slds-text-body_small" data-id="no-sets">{labels.noSets}</p>
      </template>
    </div>
  </lightning-card>
</template>
