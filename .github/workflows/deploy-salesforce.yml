name: Deploy Salesforce

on:
  push:
    branches: [develop, uat, main]

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: salesforce-deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy merged Salesforce delta
    runs-on: ubuntu-latest
    timeout-minutes: 150
    outputs:
      deploymentId: ${{ steps.operation.outputs.deploymentId }}
      componentsTotal: ${{ steps.operation.outputs.componentsTotal }}
      testsCompleted: ${{ steps.operation.outputs.testsCompleted }}
      testsFailed: ${{ steps.operation.outputs.testsFailed }}
      deletedCount: ${{ steps.operation.outputs.deletedCount }}
      versionedDestructiveApplied: ${{ steps.operation.outputs.versionedDestructiveApplied }}
      errorMessage: ${{ steps.operation.outputs.errorMessage }}
    environment: ${{ github.ref_name == 'main' && 'PROD' || (github.ref_name == 'uat' && 'UAT' || 'DEV') }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli@2.148.3
      - name: Deploy cumulative delta
        id: operation
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATION: deploy
          TARGET_ENV: ${{ github.ref_name == 'main' && 'PROD' || (github.ref_name == 'uat' && 'UAT' || 'DEV') }}
          TARGET_BRANCH: ${{ github.ref_name }}
          SALESFORCE_AUTH_URL: ${{ secrets.SALESFORCE_AUTH_URL || secrets.SALESFORCE_DEV_AUTH_URL || secrets.SALESFORCE_PROD_AUTH_URL }}
          EXPECTED_ORG_ID: ${{ vars.SALESFORCE_ORG_ID }}
          EVIDENCE_DIR: ${{ runner.temp }}/salesforce-evidence
        run: node scripts/ci/salesforce-delivery.mjs
      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: salesforce-deploy-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/salesforce-evidence/
          retention-days: 30
          if-no-files-found: warn

  comment:
    name: Publish deployment result
    if: always()
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea9 # v7.0.1
        env:
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          DEPLOYMENT_ID: ${{ needs.deploy.outputs.deploymentId }}
          COMPONENTS_TOTAL: ${{ needs.deploy.outputs.componentsTotal }}
          TESTS_COMPLETED: ${{ needs.deploy.outputs.testsCompleted }}
          TESTS_FAILED: ${{ needs.deploy.outputs.testsFailed }}
          DELETED_COUNT: ${{ needs.deploy.outputs.deletedCount }}
          VERSIONED_DESTRUCTIVE_APPLIED: ${{ needs.deploy.outputs.versionedDestructiveApplied }}
          ERROR_MESSAGE: ${{ needs.deploy.outputs.errorMessage }}
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const {data: prs} = await github.rest.repos.listPullRequestsAssociatedWithCommit({...context.repo, commit_sha: context.sha});
            const {data} = await github.rest.actions.listWorkflowRunArtifacts({...context.repo, run_id: context.runId});
            const artifact = data.artifacts[0];
            const artifactUrl = artifact ? `${runUrl}/artifacts/${artifact.id}` : null;
            const environment = context.ref === 'refs/heads/main' ? 'AXON_PROD' : (context.ref === 'refs/heads/uat' ? 'AXON_UAT' : 'AXON_DEV');
            const deletedCount = Number(process.env.DELETED_COUNT || 0);
            const versionedApplied = process.env.VERSIONED_DESTRUCTIVE_APPLIED === 'true';
            const passed = process.env.DEPLOY_RESULT === 'success';
            const icon = passed ? '✅' : '❌';
            const status = passed ? 'Passed' : 'Failed';
            let body = `### ${icon} Salesforce deployment — ${environment}: **${status}**\n\n`;
            body += [
              '| | |',
              '|---|---|',
              `| Deployment ID | ${process.env.DEPLOYMENT_ID ? '`' + process.env.DEPLOYMENT_ID + '`' : 'None'} |`,
              `| Components | ${process.env.COMPONENTS_TOTAL || '—'} |`,
              `| Tests | ${process.env.TESTS_COMPLETED || 0} completed / ${process.env.TESTS_FAILED || 0} failed |`,
              `| Commit | \`${context.sha.slice(0, 7)}\` |`
            ].join('\n') + '\n';
            if (process.env.ERROR_MESSAGE) body += `\n> ${process.env.ERROR_MESSAGE}\n`;
            if (deletedCount > 0) {
              body += `\n⚠️ **${deletedCount} deletion(s) detected — NOT auto-deployed.** \`destructiveChanges.xml\`/\`package.xml\` generated in the evidence artifact; requires manual review and a separate destructive deploy.\n`;
            }
            if (versionedApplied) {
              body += `\n🔥 **Versioned destructive manifest (\`manifest/destructiveChanges{Pre,Post}.xml\`) was applied this run** — this actually deployed a real deletion. See result.html for exactly what.\n`;
            }
            body += `\n${artifactUrl ? `[⬇️ Download evidence](${artifactUrl})` : '_No evidence artifact uploaded._'} · [Run logs](${runUrl})\n`;
            body += `\nOpen \`result.html\` in the evidence zip for the full report.`;
            for (const pr of prs.filter(p => p.merged_at && p.merge_commit_sha === context.sha)) {
              await github.rest.issues.createComment({...context.repo, issue_number: pr.number, body});
            }
