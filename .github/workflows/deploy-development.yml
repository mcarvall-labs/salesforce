name: Deploy Salesforce Development

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      base_sha:
        description: Optional base SHA; defaults to the parent of the selected commit
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: salesforce-development
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy develop delta to AxonFinanceDevHub
    runs-on: ubuntu-latest
    environment: DEV
    env:
      SALESFORCE_AUTH_URL: ${{ secrets.SALESFORCE_DEV_AUTH_URL }}
      SALESFORCE_ARTIFACT_NAME: salesforce-development-deploy-${{ github.run_id }}
      SALESFORCE_ENVIRONMENT: DEV
      SALESFORCE_OPERATION: Deployment
      SALESFORCE_TEST_LEVEL: NoTestRun
      EVENT_BASE_SHA: ${{ github.event.before }}
      MANUAL_BASE_SHA: ${{ inputs.base_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli
      - name: Authenticate DEV
        shell: bash
        run: |
          test -n "$SALESFORCE_AUTH_URL"
          auth_file="$RUNNER_TEMP/development-auth-url.txt"
          trap 'rm -f "$auth_file"' EXIT
          printf '%s' "$SALESFORCE_AUTH_URL" > "$auth_file"
          sf org login sfdx-url --sfdx-url-file "$auth_file" --alias AxonFinanceDevHub
          org_id="$(sf org display --target-org AxonFinanceDevHub --json | jq -r '.result.id')"
          test -n "$org_id" && test "$org_id" != "null"
          echo "SALESFORCE_ORG_ID=$org_id" >> "$GITHUB_ENV"
      - name: Deploy integrated delta
        id: deploy
        shell: bash
        run: |
          base_sha="${MANUAL_BASE_SHA:-$EVENT_BASE_SHA}"
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then base_sha="$GITHUB_SHA^"; fi
          git merge-base --is-ancestor "$base_sha" "$GITHUB_SHA"
          mapfile -t source_paths < <(bash scripts/ci/list-salesforce-delta.sh "$base_sha" "$GITHUB_SHA")
          if ((${#source_paths[@]} == 0)); then
            echo "No Salesforce source changes to deploy."
            exit 0
          fi
          source_args=()
          for path in "${source_paths[@]}"; do source_args+=(--source-dir "$path"); done
          set +e
          sf project deploy start "${source_args[@]}" --target-org AxonFinanceDevHub --test-level NoTestRun --wait 45 --json > salesforce-deploy.json
          deploy_status=$?
          set -e
          node scripts/ci/publish-salesforce-validation.mjs salesforce-deploy.json
          exit "$deploy_status"
      - name: Upload deployment artifact
        if: always() && hashFiles('salesforce-deploy.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SALESFORCE_ARTIFACT_NAME }}
          path: salesforce-deploy.json
          if-no-files-found: error
          retention-days: 30
      - name: Record deployed commit
        run: echo "Deployed ${GITHUB_SHA} delta to AxonFinanceDevHub"
