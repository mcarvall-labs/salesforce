name: Salesforce CI

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: salesforce-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check formatting of changed files
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$GITHUB_SHA" | grep -E '\.(cls|cmp|component|css|html|js|json|md|page|trigger|xml|yaml|yml)$' || true)
          if ((${#files[@]})); then npx prettier --check "${files[@]}"; fi
      - name: Lint changed Lightning code
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$GITHUB_SHA" | grep -E 'force-app/.*/(aura|lwc)/.*\.js$' || true)
          if ((${#files[@]})); then npx eslint "${files[@]}"; fi
      - name: Run LWC unit tests
        run: npm run test:unit -- -- --runInBand

  salesforce-validation:
    name: Validate Salesforce delta
    runs-on: ubuntu-latest
    environment: DEV
    env:
      SALESFORCE_AUTH_URL: ${{ secrets.SALESFORCE_DEV_AUTH_URL }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect Salesforce metadata changes
        id: salesforce-delta
        shell: bash
        run: |
          mapfile -t source_paths < <(bash scripts/ci/list-salesforce-delta.sh "$BASE_SHA" "$GITHUB_SHA")
          if ((${#source_paths[@]} == 0)); then
            echo "has_delta=false" >> "$GITHUB_OUTPUT"
            echo "No Salesforce source changes to validate."
          else
            echo "has_delta=true" >> "$GITHUB_OUTPUT"
            printf 'Salesforce source path: %s\n' "${source_paths[@]}"
          fi
      - uses: actions/setup-node@v4
        if: steps.salesforce-delta.outputs.has_delta == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Install Salesforce CLI
        if: steps.salesforce-delta.outputs.has_delta == 'true'
        run: npm install --global @salesforce/cli
      - name: Authenticate DEV
        if: steps.salesforce-delta.outputs.has_delta == 'true'
        shell: bash
        run: |
          test -n "$SALESFORCE_AUTH_URL"
          auth_file="$RUNNER_TEMP/development-auth-url.txt"
          trap 'rm -f "$auth_file"' EXIT
          printf '%s' "$SALESFORCE_AUTH_URL" > "$auth_file"
          sf org login sfdx-url --sfdx-url-file "$auth_file" --alias AxonFinanceDevHub
      - name: Validate changed Salesforce metadata without deploying
        if: steps.salesforce-delta.outputs.has_delta == 'true'
        shell: bash
        run: |
          mapfile -t source_paths < <(bash scripts/ci/list-salesforce-delta.sh "$BASE_SHA" "$GITHUB_SHA")
          source_args=()
          for path in "${source_paths[@]}"; do source_args+=(--source-dir "$path"); done
          sf project deploy validate "${source_args[@]}" --target-org AxonFinanceDevHub --test-level NoTestRun --wait 45
