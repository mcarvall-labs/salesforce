name: Salesforce CI

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: salesforce-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check formatting of changed files
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$GITHUB_SHA" | grep -E '\.(cls|cmp|component|css|html|js|json|md|page|trigger|xml|yaml|yml)$' || true)
          if ((${#files[@]})); then npx prettier --check "${files[@]}"; fi
      - name: Lint changed Lightning code
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$GITHUB_SHA" | grep -E 'force-app/.*/(aura|lwc)/.*\.js$' || true)
          if ((${#files[@]})); then npx eslint "${files[@]}"; fi
      - name: Run LWC unit tests
        run: npm run test:unit -- -- --runInBand

  salesforce-validation:
    name: Validate Salesforce delta
    runs-on: ubuntu-latest
    environment: DEV
    env:
      SALESFORCE_AUTH_URL: ${{ secrets.SALESFORCE_DEV_AUTH_URL }}
      AXON_DEV_ORG_ID: 00Dfj00000YrNnkEAF
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Detect Salesforce metadata changes
        id: salesforce-delta
        shell: bash
        run: |
          mapfile -t source_paths < <(bash scripts/ci/list-salesforce-delta.sh "$BASE_SHA" "$GITHUB_SHA")
          if ((${#source_paths[@]} == 0)); then
            echo "has_delta=false" >> "$GITHUB_OUTPUT"
            echo "No Salesforce source changes to validate."
          else
            echo "has_delta=true" >> "$GITHUB_OUTPUT"
            printf 'Salesforce source path: %s\n' "${source_paths[@]}"
          fi
      - name: Install Salesforce CLI
        if: steps.salesforce-delta.outputs.has_delta == 'true'
        run: npm install --global @salesforce/cli@2.148.3
      - name: Authenticate DEV
        if: steps.salesforce-delta.outputs.has_delta == 'true'
        shell: bash
        run: |
          test -n "$SALESFORCE_AUTH_URL"
          auth_file="$RUNNER_TEMP/development-auth-url.txt"
          trap 'rm -f "$auth_file"' EXIT
          printf '%s' "$SALESFORCE_AUTH_URL" > "$auth_file"
          sf org login sfdx-url --sfdx-url-file "$auth_file" --alias AXON_DEV
          actual_org_id="$(sf org display --target-org AXON_DEV --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).result.id))")"
          test "$actual_org_id" = "$AXON_DEV_ORG_ID"
      - name: Validate changed Salesforce metadata without deploying
        id: salesforce-validation
        if: steps.salesforce-delta.outputs.has_delta == 'true'
        shell: bash
        run: |
          mapfile -t source_paths < <(bash scripts/ci/list-salesforce-delta.sh "$BASE_SHA" "$GITHUB_SHA")
          apex_tests_file="$RUNNER_TEMP/axon-delta-tests.txt"
          bash scripts/ci/list-salesforce-tests.sh "$BASE_SHA" "$GITHUB_SHA" > "$apex_tests_file"
          mapfile -t apex_tests < "$apex_tests_file"
          source_args=()
          for path in "${source_paths[@]}"; do source_args+=(--source-dir "$path"); done
          test_args=(--test-level NoTestRun)
          if ((${#apex_tests[@]})); then
            test_args=(--test-level RunSpecifiedTests)
            for test_class in "${apex_tests[@]}"; do test_args+=(--tests "$test_class"); done
          fi
          set +e
          sf project deploy start "${source_args[@]}" "${test_args[@]}" --target-org AXON_DEV --dry-run --wait 45 --json > salesforce-validation.json
          validation_status=$?
          set -e
          node scripts/ci/publish-salesforce-validation.mjs salesforce-validation.json
          exit "$validation_status"
