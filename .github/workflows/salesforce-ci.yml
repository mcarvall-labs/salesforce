name: Salesforce CI

on:
  pull_request:
    branches: [develop, uat, main]

permissions:
  contents: read

concurrency:
  group: salesforce-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scope:
    name: Detect metadata scope
    runs-on: ubuntu-latest
    outputs:
      has_metadata: ${{ steps.scope.outputs.has_metadata }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --name-only "$BASE_SHA" "$GITHUB_SHA" -- force-app > "$RUNNER_TEMP/metadata-paths.txt"
          if test -s "$RUNNER_TEMP/metadata-paths.txt"; then
            echo "has_metadata=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_metadata=false" >> "$GITHUB_OUTPUT"
          fi

  quality:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check formatting of changed files
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$GITHUB_SHA" | grep -E '\.(cls|cmp|component|css|html|js|mjs|json|md|page|trigger|xml|yaml|yml)$' || true)
          if ((${#files[@]})); then npx prettier --check "${files[@]}"; fi
      - name: Lint changed Lightning code
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$GITHUB_SHA" | grep -E 'force-app/.*/(aura|lwc)/.*\.js$' || true)
          if ((${#files[@]})); then npx eslint "${files[@]}"; fi
      - name: Run LWC unit tests
        run: npm run test:unit -- -- --runInBand
      - name: Test delivery automation
        run: node --test scripts/ci/salesforce-delivery.test.mjs

  salesforce-validation:
    name: Validate Salesforce delta
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 150
    outputs:
      summary: ${{ steps.operation.outputs.summary }}
    environment: ${{ needs.scope.outputs.has_metadata != 'true' && 'CI' || (github.base_ref == 'main' && 'PROD-VALIDATION' || (github.base_ref == 'uat' && 'UAT-VALIDATION' || 'DEV-VALIDATION')) }}
    permissions:
      contents: read
      actions: read
    steps:
      - name: Reject untrusted PR sources
        env:
          SAME_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: test "$SAME_REPOSITORY" = "true"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install Salesforce CLI
        if: needs.scope.outputs.has_metadata == 'true'
        run: npm install --global @salesforce/cli@2.148.3
      - name: Validate delta without persisting changes
        id: operation
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATION: validate
          TARGET_ENV: ${{ github.base_ref == 'main' && 'PROD' || (github.base_ref == 'uat' && 'UAT' || 'DEV') }}
          TARGET_BRANCH: ${{ github.base_ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SALESFORCE_AUTH_URL: ${{ needs.scope.outputs.has_metadata == 'true' && (secrets.SALESFORCE_AUTH_URL || secrets.SALESFORCE_DEV_AUTH_URL || secrets.SALESFORCE_PROD_AUTH_URL) || '' }}
          EXPECTED_ORG_ID: ${{ vars.SALESFORCE_ORG_ID }}
          INITIAL_BASE_SHA: ${{ vars.SALESFORCE_BASE_SHA }}
          EVIDENCE_DIR: ${{ runner.temp }}/salesforce-evidence
        run: node scripts/ci/salesforce-delivery.mjs
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: salesforce-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/salesforce-evidence/
          retention-days: 30
          if-no-files-found: warn

  comment:
    name: Publish validation result
    if: always() && github.event.pull_request.head.repo.full_name == github.repository
    needs: [quality, salesforce-validation]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
    steps:
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea9 # v7.0.1
        env:
          VALIDATION_RESULT: ${{ needs.salesforce-validation.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          VALIDATED_SHA: ${{ github.sha }}
          SF_SUMMARY: ${{ needs.salesforce-validation.outputs.summary }}
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const {data} = await github.rest.actions.listWorkflowRunArtifacts({...context.repo, run_id: context.runId});
            const ref = context.payload.pull_request.base.ref;
            const target = ref === 'main' ? 'AXON_PROD' : (ref === 'uat' ? 'AXON_UAT' : 'AXON_DEV');
            await github.rest.issues.createComment({...context.repo, issue_number: context.issue.number,
              body: `## Salesforce PR validation: ${target}\n\n**Validation job:** ${process.env.VALIDATION_RESULT}\n**Quality checks:** ${process.env.QUALITY_RESULT}\n**Validated merge SHA:** \`${process.env.VALIDATED_SHA}\`\n\n${process.env.SF_SUMMARY || 'Validation did not produce a report.'}\n\n[Validation summary and logs](${runUrl})\n\n### Evidence\n${evidence}\n\nValidation uses dry-run: no metadata is persisted.`});
