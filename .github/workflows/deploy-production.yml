name: Deploy Salesforce Production

on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Full SHA currently deployed to production
        required: true
        type: string
      commit_sha:
        description: Full SHA from main approved for production
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: salesforce-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy main delta to AxonFinance
    runs-on: ubuntu-latest
    environment: PROD
    env:
      SALESFORCE_AUTH_URL: ${{ secrets.SALESFORCE_PROD_AUTH_URL }}
      SALESFORCE_ENVIRONMENT: PROD
      BASE_SHA: ${{ inputs.base_sha }}
    steps:
      - name: Checkout approved commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
      - name: Verify release commit chain
        shell: bash
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          git merge-base --is-ancestor "$BASE_SHA" "$GITHUB_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli
      - name: Authenticate production
        shell: bash
        run: |
          test -n "$SALESFORCE_AUTH_URL"
          auth_file="$RUNNER_TEMP/production-auth-url.txt"
          trap 'rm -f "$auth_file"' EXIT
          printf '%s' "$SALESFORCE_AUTH_URL" > "$auth_file"
          sf org login sfdx-url --sfdx-url-file "$auth_file" --alias AxonFinance
          org_id="$(sf org display --target-org AxonFinance --json | jq -r '.result.id')"
          test -n "$org_id" && test "$org_id" != "null"
          echo "SALESFORCE_ORG_ID=$org_id" >> "$GITHUB_ENV"
      - name: Validate production delta
        id: validate
        shell: bash
        run: |
          mapfile -t source_paths < <(bash scripts/ci/list-salesforce-delta.sh "$BASE_SHA" "$GITHUB_SHA")
          if ((${#source_paths[@]} == 0)); then
            echo "No Salesforce source changes to deploy."
            echo "has-source=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          source_args=()
          for path in "${source_paths[@]}"; do source_args+=(--source-dir "$path"); done
          set +e
          sf project deploy validate "${source_args[@]}" --target-org AxonFinance --test-level RunLocalTests --wait 60 --json > salesforce-production-validation.json
          validation_status=$?
          set -e
          SALESFORCE_OPERATION="Production validation" SALESFORCE_TEST_LEVEL="RunLocalTests" SALESFORCE_ARTIFACT_NAME="salesforce-production-validation-${GITHUB_RUN_ID}" node scripts/ci/publish-salesforce-validation.mjs salesforce-production-validation.json
          if ((validation_status != 0)); then exit "$validation_status"; fi
          deploy_id="$(jq -r '.result.id' salesforce-production-validation.json)"
          test -n "$deploy_id"
          test "$deploy_id" != "null"
          echo "has-source=true" >> "$GITHUB_OUTPUT"
          echo "deployment-id=$deploy_id" >> "$GITHUB_OUTPUT"
      - name: Upload production validation artifact
        if: always() && hashFiles('salesforce-production-validation.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: salesforce-production-validation-${{ github.run_id }}
          path: salesforce-production-validation.json
          if-no-files-found: error
          retention-days: 90
      - name: Quick deploy validated delta
        if: steps.validate.outputs.has-source == 'true'
        shell: bash
        run: |
          set +e
          sf project deploy quick --target-org AxonFinance --job-id "${{ steps.validate.outputs.deployment-id }}" --wait 45 --json > salesforce-production-deploy.json
          deploy_status=$?
          set -e
          SALESFORCE_OPERATION="Production deployment" SALESFORCE_TEST_LEVEL="RunLocalTests (validated)" SALESFORCE_ARTIFACT_NAME="salesforce-production-deploy-${GITHUB_RUN_ID}" node scripts/ci/publish-salesforce-validation.mjs salesforce-production-deploy.json
          exit "$deploy_status"
      - name: Upload production deployment artifact
        if: always() && hashFiles('salesforce-production-deploy.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: salesforce-production-deploy-${{ github.run_id }}
          path: salesforce-production-deploy.json
          if-no-files-found: error
          retention-days: 90
      - name: Record deployed commit
        run: echo "Processed ${GITHUB_SHA} for AxonFinance"
